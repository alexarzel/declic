name: Construire l'appli Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Le SDK Android est déjà installé sur les machines ubuntu de GitHub (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Préparer la page de l'appli
        run: python3 tools/build_web.py

      - name: Préparer la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Il manque les secrets KEYSTORE_B64 et KEYSTORE_PASSWORD (la clé de signature) : l'APK est construit pour vérification mais pas publié."
            echo "NO_RELEASE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Construire l'APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: declic
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Publier la version
        if: env.NO_RELEASE != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk declic.apk
          cp android/app/src/main/assets/www/index.html web.html
          cp android/native-version.txt native-version.txt
          NOTES=$(git log -1 --pretty=%s)
          gh release create "v${BUILD_NUMBER}" declic.apk web.html native-version.txt \
            --title "Déclic 1.${BUILD_NUMBER}" \
            --notes "$NOTES" \
            --latest

      - name: Signaler l'absence de clé
        if: env.NO_RELEASE == '1'
        run: |
          echo "::error::APK construit mais non publié : ajoute les secrets KEYSTORE_B64 et KEYSTORE_PASSWORD au dépôt."
          exit 1
