<title>Déclic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout : appli une colonne, barre d'onglets fixe en bas, séance guidée en plein écran. */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --sunk:#E2E8EE; --ink:#0F1C26; --muted:#566775; --line:#D3DCE4;
  --accent:#1D58F2; --accent-soft:#DCE6FF; --on-accent:#FFFFFF;
  --fig-far:#9DB5F7; --heat:#F2611D; --heat-soft:#FFE6D9; --good:#0F9A64; --rest:#0B8C8C; --rest-soft:#D5F1F0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1117; --surface:#131D26; --sunk:#0F171E; --ink:#E6EDF3; --muted:#8D9CA8; --line:#24323E;
  --accent:#5D87FF; --fig-far:#34508F; --accent-soft:#1A2950; --on-accent:#08101A;
  --heat:#FF8550; --heat-soft:#3A2115; --good:#2BC88A; --rest:#2CC4C4; --rest-soft:#0F3133; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1117; --surface:#131D26; --sunk:#0F171E; --ink:#E6EDF3; --muted:#8D9CA8; --line:#24323E;
  --accent:#5D87FF; --fig-far:#34508F; --accent-soft:#1A2950; --on-accent:#08101A;
  --heat:#FF8550; --heat-soft:#3A2115; --good:#2BC88A; --rest:#2CC4C4; --rest-soft:#0F3133; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible+span,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.1rem;font-weight:800}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:1rem;background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.big{width:100%;padding:18px;font-size:1.15rem;font-family:var(--display);letter-spacing:.04em;text-transform:uppercase}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.chip.heat{background:var(--heat-soft);color:var(--heat)}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sync{font-size:.72rem;color:var(--muted)}

/* hero seance */
.hero{background:var(--accent);color:var(--on-accent);border:0;position:relative;overflow:hidden}
.hero .eyebrow{color:inherit;opacity:.8}
.hero h1{font-size:2.6rem}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;font-weight:600}
.hero .meta b{font-family:var(--display);font-size:1.6rem;display:block;line-height:1}
.hero .meta span{font-size:.75rem;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.hero .btn{background:var(--on-accent);color:var(--accent)}
.hero svg.stripes{position:absolute;right:-20px;top:-10px;opacity:.14;pointer-events:none}

/* semaine */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);font-weight:600}
.dot{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center}
.dot.done{background:var(--good);color:#fff}
.dot.today{box-shadow:0 0 0 2px var(--accent) inset}
.ring{flex:none}
.streak{display:flex;gap:14px;align-items:center}
.streak .n{font-family:var(--display);font-size:2.6rem;font-weight:800;color:var(--heat);line-height:1}

.list{display:flex;flex-direction:column}
.ex{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .dose{font-family:var(--display);font-weight:700;font-size:1.15rem;white-space:nowrap}
.quote{font-family:var(--display);font-size:1.35rem;font-weight:600;line-height:1.2}

/* progres */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:12px}
.stat b{font-family:var(--display);font-size:1.8rem;display:block;line-height:1}
.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.xpbar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.heat-grid{display:grid;grid-template-columns:auto repeat(10,1fr);gap:4px;font-size:.65rem;color:var(--muted);align-items:center}
.cell{aspect-ratio:1;border-radius:4px;background:var(--sunk);max-width:100%}
.cell.on{background:var(--good)}
.cell.future{background:transparent;border:1px dashed var(--line)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{border-radius:12px;padding:10px;text-align:center;background:var(--sunk);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem;line-height:1.25}
.badge .medal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--line);color:var(--muted)}
.badge.got .medal{background:var(--heat);color:#fff}
.badge:not(.got){opacity:.6}
.hist{display:flex;flex-direction:column}
.hist .h{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem;gap:10px}
.chart{width:100%;height:auto;display:block}

/* formulaires */
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lab{font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.text{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{font-family:var(--display);font-size:1.6rem;min-width:3ch;text-align:center}
.note{font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:12px;padding:12px}

/* onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
nav.tabs button{background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}

/* seance plein écran */
.player{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.player.rest{background:var(--rest-soft)}
.player .pin{flex:1;display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px;min-height:0}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.player.rest .prog i{background:var(--rest)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;min-height:0;overflow-y:auto}
.stage .kind{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.player.rest .stage .kind{color:var(--rest)}
.stage h1{font-size:2.6rem}
.big{font-family:var(--display);font-weight:800;font-size:clamp(5rem,30vw,9rem);line-height:.9;font-variant-numeric:tabular-nums}
.big small{font-size:.32em;font-weight:700;display:block;letter-spacing:.04em}
.cue{max-width:34ch;color:var(--muted)}
.next{font-size:.9rem;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}
.controls .btn{padding:16px 8px}
.confirm{display:flex;flex-direction:column;gap:10px}
.rate{display:grid;gap:10px}
.rate button{text-align:left;display:flex;flex-direction:column;gap:2px}
.rate button span{font-weight:400;font-size:.85rem;color:var(--muted)}
.rate button.primary span{color:inherit;opacity:.85}
.won{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
/* objectif */
.goal{border-color:var(--good)}
.gbar{height:14px;border-radius:99px;background:var(--sunk);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--good);border-radius:99px;min-width:14px}
.ok{color:var(--good);font-weight:600}
.warn{color:var(--heat);font-weight:600;font-size:.9rem}
.goalbox{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:12px;padding:12px}
.goalbox label{font-weight:500;font-size:.92rem}
.upd{border-color:var(--accent);background:var(--accent-soft)}
/* coach */
.coach{gap:10px}
.coach-head{display:flex;gap:12px;align-items:center}
.coach-av{flex:none;width:48px;height:48px}
.bubble{background:var(--sunk);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:.95rem}
.bubble.me{background:var(--accent-soft);color:var(--ink);border-radius:14px 4px 14px 14px;align-self:flex-end;max-width:85%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:.85rem;font-weight:600}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days7 .opt span{padding:10px 0;text-align:center}
.pacebox:empty{display:none}
.pacebox{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:.9rem;background:var(--surface);border:1.5px solid var(--good)}
.pacebox.too{border-color:var(--heat)}
.pacebox.need{box-shadow:0 0 0 3px var(--heat-soft)}
.pacebox .row{flex-wrap:wrap;gap:8px}
/* graphique */
.legend{display:flex;gap:16px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend i.lg-t{border-top:2px dashed var(--good)}
.track{font-weight:600;font-size:.9rem}
.track.ahead{color:var(--good)}.track.behind{color:var(--heat)}
/* repas, défis, pas, bilan */
.tips{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.chal{border-color:var(--heat)}
.chal.done{border-color:var(--good)}
.recap{background:var(--accent-soft);border-color:var(--accent)}
.recap .stats .stat{background:var(--surface)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px}
.bars .b{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:.68rem;color:var(--muted)}
.bars .b i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--sunk)}
.bars .b i.ok{background:var(--good)}.bars .b i.part{background:var(--accent)}
.mealall{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow-y:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label{display:block;font-weight:500;font-size:.88rem;margin-bottom:4px}
.bodybox{background:var(--sunk);border-radius:12px;padding:12px}
.macs{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.mrow .ml{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;margin-bottom:4px}
.nbar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.nbar i{display:block;height:100%;border-radius:99px;min-width:0}
.daynav b{font-size:1rem}
.daynav .btn{min-width:44px}
.fres{display:flex;flex-direction:column;gap:6px}
.fitem{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.fitem span{display:flex;flex-direction:column}
.fitem small{font-size:.78rem}
.fitem .num{text-align:right;white-space:nowrap;font-weight:600}
.fsel{display:flex;flex-direction:column;gap:10px}
.fmeal h3{font-size:1rem}
.flist{list-style:none;margin:6px 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.flist li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.flist li div{display:flex;flex-direction:column;min-width:0}
.flist small{font-size:.76rem}
.fx{border:0;background:var(--sunk);color:var(--muted);width:32px;height:32px;border-radius:99px;font-size:1.1rem;cursor:pointer}
.bars .b i.over{background:var(--heat)}
.ntab{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0}
.ntab td,.ntab th{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.ntab td:last-child,.ntab th:last-child{text-align:right;white-space:nowrap;padding-left:10px;font-weight:600}
.ntab small{display:block;font-size:.76rem;font-weight:400}
.ntab tr.tot td{font-weight:700}
.ntab th{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
details.card>summary{cursor:pointer;list-style-position:inside}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
.chipbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tscroll{overflow-x:auto;margin:10px 0;max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
.ftab{width:100%;border-collapse:collapse;font-size:.8rem}
.ftab th{position:sticky;top:0;background:var(--surface);font-size:.72rem;color:var(--muted);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
.ftab td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
.ftab th:first-child,.ftab td:first-child{text-align:left}
.ftab tbody tr{cursor:pointer}
.ftab tbody tr:hover,.ftab tbody tr:focus{background:var(--accent-soft);outline:none}
textarea.text{resize:vertical;min-height:90px;font-family:ui-monospace,monospace;font-size:.8rem}
.meal h3{font-size:1.3rem}
.meal .ing{font-size:.92rem}
.mealplan{display:flex;flex-direction:column;gap:10px}
.mealplan div{border-top:1px solid var(--line);padding-top:8px}
.ai-out{white-space:pre-line;font-size:.92rem}
/* eau, sommeil, courses */
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.glasses svg{width:26px;height:32px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale .opt span{padding:8px 2px;text-align:center;font-size:.78rem}
.shop label{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.shop input{width:20px;height:20px;accent-color:var(--good)}
.shop .got{text-decoration:line-through;color:var(--muted)}
/* démos & musique */
.demo{width:100%;max-width:220px;height:auto;display:block;margin:0 auto;background:var(--sunk);border-radius:12px}
.demo.sm{max-width:180px}
.player .demo{max-width:min(240px,32vh);background:var(--surface)}
.player.rest .demo{background:var(--surface)}
details.ex{display:block}
details.ex summary{list-style:none;display:flex;justify-content:space-between;gap:12px;cursor:pointer}
details.ex summary::-webkit-details-marker{display:none}
details.ex .how{font-size:.78rem;color:var(--accent);font-weight:600}
details.ex[open] .how{color:var(--muted)}
.demo-box{display:flex;flex-direction:column;gap:8px;padding-top:10px;align-items:center;text-align:center}
.demo-box a,.vid{font-size:.85rem;color:var(--accent);font-weight:600}
.mbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}
.mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upl{text-align:center;display:block}
a.btn{text-decoration:none;color:inherit;display:inline-block}
a.btn.small{flex:none}
.opt-a{padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:.85rem;color:var(--ink);text-decoration:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.player .stage .big{font-size:clamp(3.6rem,18vw,6.5rem)}
.player .stage h1{font-size:2.1rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<div id="player" class="player" hidden></div>

<script>
"use strict";
/* ---------- Données ---------- */
const EX = {
  squat:{n:"Squats",m:"reps",b:8,k:.8,x:30,c:"Pieds largeur d'épaules. Descends comme pour t'asseoir, dos droit, talons au sol."},
  squat_goblet:{n:"Squats goblet (haltère)",m:"reps",b:8,k:.6,x:22,c:"Haltère tenu contre la poitrine, coudes vers le bas. Descends en gardant le buste fier."},
  squat_saute:{n:"Squats sautés",m:"reps",b:6,k:.6,x:22,c:"Descends en squat puis pousse fort pour décoller. Atterris en souplesse."},
  fente:{n:"Fentes alternées",m:"reps",b:6,k:.5,x:16,s:1,c:"Grand pas en avant, le genou arrière frôle le sol. Reviens et change de jambe."},
  fente_sautee:{n:"Fentes sautées",m:"reps",b:5,k:.4,x:14,s:1,c:"Depuis la fente, saute et inverse les jambes en l'air."},
  pont:{n:"Pont fessier",m:"reps",b:10,k:1,x:30,c:"Allongé sur le dos, pieds au sol. Monte le bassin en serrant les fessiers, redescends lentement."},
  pont1:{n:"Pont fessier sur une jambe",m:"reps",b:6,k:.5,x:16,s:1,c:"Une jambe tendue en l'air, pousse sur l'autre talon pour monter le bassin."},
  planche:{n:"Gainage planche",m:"time",b:20,k:3,x:90,c:"Sur les avant-bras, corps aligné des épaules aux talons. Ventre serré, respire."},
  lat:{n:"Gainage latéral",m:"time",b:20,k:2.5,x:70,c:"Sur un avant-bras, bassin haut. Change de côté à la moitié du temps."},
  jacks:{n:"Jumping jacks",m:"time",b:25,k:2,x:50,c:"Saute en écartant bras et jambes, puis reviens. Garde un rythme régulier."},
  genoux:{n:"Montées de genoux",m:"time",b:20,k:2,x:45,c:"Cours sur place en montant les genoux à hauteur de hanches."},
  mountain:{n:"Mountain climbers",m:"time",b:15,k:2,x:45,c:"En position de pompe, ramène les genoux vers la poitrine en alternance, vite."},

const KEY="elan-state-v1";
let S=null, tab="today", dbRef=null, sync="…", saving=false, again=false;
function loadLocal(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
async function save(){
  S.updatedAt=Date.now();saveLocal();
  if(!dbRef)return;
  if(saving){again=true;return}
  saving=true;
  try{await dbRef.set(JSON.parse(JSON.stringify(S)));setSync("cloud")}catch(e){if(e&&(e.code==="invalid_argument"||e.code==="not_granted"||e.code==="permission_denied")){dbRef=null;setSync("local")}else setSync("err")}

}
function setSync(s){sync=s;const el=document.getElementById("sync");if(el)el.textContent=syncLabel()}
function syncLabel(){return sync==="cloud"?"Sauvegardé dans ton compte":sync==="local"?"Sauvegardé sur cet appareil":sync==="err"?"Sauvegarde en ligne impossible, gardé sur cet appareil":"Connexion…"}
S=loadLocal();
(async()=>{
  const t=setTimeout(()=>setSync("local"),10000);
  try{
    const db=await window.claude?.use?.("db"), user=await window.claude?.use?.("user");
    if(!db||!user){clearTimeout(t);setSync("local");return}
    const id=await user.id();
    dbRef=db.collection("data/users/"+id).doc("state");
    const snap=await dbRef.get();clearTimeout(t);
    if(snap.exists){const r=snap.data();
      if(!S||(r.updatedAt||0)>(S.updatedAt||0)){S=JSON.parse(JSON.stringify(r));saveLocal();if(document.getElementById("player").hidden)render()}
      else if((r.updatedAt||0)<(S.updatedAt||0))save();

})();

const START={deb:1,int:7,ava:13};
function adapt(id,lim,goal,p){
  const nj=lim.includes("nojump")||goal==="douceur",nf=lim.includes("nofloor");
  const J={squat_saute:"squat",fente_sautee:"fente",burpee:"squat_bras",burpee_doux:"squat_bras",jacks:"pas_chasses",genoux:"genoux_marche"};
  const F={pont:"ext_hanche",pont1:"ext_hanche",planche:"planche_mur",lat:"genou_coude",velo:"genou_coude",deadbug:"genou_coude",superman:"w_debout",mountain:"genoux_marche",burpee:"squat_bras",burpee_doux:"squat_bras",pompe:"pompe_incl",pompe_gen:"pompe_incl"};
  if(nj&&J[id])id=J[id];
  if(nf&&F[id])id=F[id];
  if(nf&&id==="pompe_incl"&&p<3)id="pompe_mur";
  if(nj&&J[id])id=J[id];
  if((S.profile.equip||[]).includes("rien")){
    if(id==="pompe_incl")id="pompe_mur";
    if(id==="dips")id=nf?"triceps_mur":"dips_sol";
  }
  return id;
}
function pick(slot,p,eq){
  const h=eq.includes("halteres"),e=eq.includes("elastique");
  switch(slot){
    case"squat":return p>=12?"squat_saute":h&&p>=4?"squat_goblet":"squat";
    case"fente":return p>=15?"fente_sautee":"fente";
    case"pont":return p>=10?"pont1":"pont";
    case"pompe":return p>=10?"pompe":p>=5?"pompe_gen":"pompe_incl";
    case"dos":return h?"rowing":e?"tirage":"superman";
    case"burpee":return p>=8?"burpee":"burpee_doux";
    case"core":return p>=6?"velo":"deadbug";
    case"bas2":return p>=6?"mollets":"mollets";
    default:return slot;
  }
}
const PLAN={A:["squat","fente","pont","planche","jacks","bas2"],B:["pompe","dos","dips","lat","genoux"],C:["burpee","squat","pompe","mountain","core"]};
function dose(id,p,goal){
  const e=EX[id];let v=e.b+e.k*(p-1);
  if(goal==="force"&&e.m==="reps")v*=1.15;
  v=Math.min(e.x,v);
  return e.m==="time"?Math.max(10,Math.round(v/5)*5):Math.max(3,Math.round(v));
}
function stepSec(st){return st.m==="time"?st.v:st.v*(st.s?2:1)*3}
function buildSession(minOverride){
  const wa=wellAdjust();
  const pr=S.profile,goal=pr.goal,lim=pr.lim||[],p0=goal==="douceur"?Math.min(10,Math.floor(S.palier)):Math.floor(S.palier),p=wa.light?Math.max(1,p0-2):wa.boost?Math.min(20,p0+1):p0,idx=S.sessions.length,type=["A","B","C"][idx%3];
  let plan=PLAN[type].slice();
  if(goal==="poids"&&type!=="A")plan.push("jacks");
  if(goal==="force")plan=plan.filter(x=>x!=="jacks"&&x!=="genoux");
  if(goal==="tonus")plan.push("core");
  const seen=new Set();
  const exs=plan.map(sl=>adapt(pick(sl,p,pr.equip),lim,goal,p)).filter(id=>!seen.has(id)&&seen.add(id)).map(id=>({id,n:EX[id].n,c:EX[id].c+(goal==="tonus"&&EX[id].m==="reps"?" Descends lentement, en 3 secondes.":""),m:EX[id].m,s:EX[id].s,v:dose(id,p,goal)}));
  let rest=p<6?30:p<12?25:20;if(goal==="poids")rest-=5;if(goal==="force")rest+=15;if(goal==="douceur")rest+=15;
  const rr=p>=12?45:60, short=pr.minutes<=10;
  const warm=(short?WARM.slice(0,3):WARM).map(([n,v,c])=>({k:"warm",n,c,m:"time",v}));
  const cool=(short?COOL.slice(2):COOL).map(([n,v,c])=>({k:"cool",n,c,m:"time",v}));
  const make=R=>{
    const st=[...warm];
    for(let r=1;r<=R;r++){exs.forEach((e,i)=>{st.push({k:"work",...e,r,R});
      if(i<exs.length-1)st.push({k:"rest",n:"Récupération",m:"time",v:rest,r,R});
      else if(r<R)st.push({k:"rest",n:"Pause entre les tours",m:"time",v:rr,r,R});});}
    const fin=adapt("genoux",lim,goal,p);if(goal==="poids")st.push({k:"work",id:fin,n:"Finisher : "+EX[fin].n.toLowerCase(),c:EX[fin].c,m:"time",v:p>=8?45:30,r:R,R});
    st.push(...cool);return st;
  };
  const target=Math.round((minOverride||pr.minutes)*(wa.light?.7:1));let R=1;for(let k=2;k<=6;k++){if(make(k).reduce((a,s)=>a+stepSec(s),0)<=target*60+60)R=k;}
  const steps=make(R),est=Math.round(steps.reduce((a,s)=>a+stepSec(s),0)/60);
  return {type,name:TYPES[type],exs,rounds:R,rest,steps,est,num:idx+1,light:wa.light,boost:wa.boost,why:wa.why};
}
function doseLabel(e){return e.m==="time"?`${e.v} s`:`${e.v}${e.s?" / côté":""}`}

/* ---------- Objectif ---------- */
function series(){const g=S.profile.goal;if(g==="poids")return (S.weights||[]).map(w=>({d:w.d,v:w.kg}));return ((S.measures||{})[g])||[]}
function goalInfo(){
  const pr=S.profile,G=GOALS[pr.goal]||GOALS.forme,o=pr.obj||{};
  if(!o.target)return {G,none:true};
  let start=+o.start||0,cur,target=+o.target;
  if(pr.goal==="douceur"){start=0;cur=S.sessions.filter(x=>new Date(x.d).getTime()>=(o.setAt||0)).length}
  else{const sr=series();cur=sr.length?sr[sr.length-1].v:start}
  const span=target-start,pct=span===0?1:Math.max(0,Math.min(1,(cur-start)/span));
  const reached=G.dir>0?cur>=target:cur<=target;
  const end=o.setAt&&o.weeks?o.setAt+o.weeks*7*864e5:null,wl=end?Math.max(0,(end-Date.now())/(7*864e5)):null;
  const left=Math.abs(target-cur),perWeek=wl&&wl>.5?left/wl:null;
  return {G,start,cur,target,pct,reached,end,wl,left,perWeek};
}
const fmtN=(v,u)=>`${String(Math.round(v*10)/10).replace(".",",")} ${u}`;
function chartSvg(sr,unit,target,traj){
  if(sr.length<1||(sr.length<2&&!traj))return "";
  const W=320,H=150,PL=34,PR=12,PT=12,PB=22;
  const ts=sr.map(x=>new Date(x.d).getTime());
  let t0=Math.min(...ts),t1=Math.max(...ts);if(traj){t0=Math.min(t0,traj.t0);t1=Math.max(t1,traj.t1)}if(t1-t0<864e5)t1=t0+864e5;
  const vs=sr.map(x=>x.v).concat(target!=null?[target]:[]).concat(traj?[traj.v0,traj.v1]:[]);
  let mn=Math.min(...vs),mx=Math.max(...vs);const pad=Math.max(.5,(mx-mn)*.08);mn-=pad;mx+=pad;
  const X=t=>PL+(W-PL-PR)*(t-t0)/(t1-t0),Y=v=>PT+(H-PT-PB)*(1-(v-mn)/(mx-mn));
  const r1=v=>String(Math.round(v*10)/10).replace(".",",");
  const ds=t=>new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
  const ticks=[mn+pad,(mn+mx)/2,mx-pad];
  const pts=sr.map(x=>[X(new Date(x.d).getTime()),Y(x.v)]),last=pts[pts.length-1];
  const now=Date.now();
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution : ${unit}${traj?", comparée à la trajectoire visée":""}">
    ${ticks.map(v=>`<line x1="${PL}" x2="${W-PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${PL-4}" y="${Y(v)+3}" font-size="9.5" fill="var(--muted)" text-anchor="end">${r1(v)}</text>`).join("")}
    ${traj?`<line x1="${X(traj.t0)}" y1="${Y(traj.v0)}" x2="${X(traj.t1)}" y2="${Y(traj.v1)}" stroke="var(--good)" stroke-width="2" stroke-dasharray="6 5"/><circle cx="${X(traj.t1)}" cy="${Y(traj.v1)}" r="4" fill="var(--good)"/>`:""}
    ${now>t0&&now<t1?`<line x1="${X(now)}" x2="${X(now)}" y1="${PT}" y2="${H-PB}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/>`:""}
    ${pts.length>1?`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--accent)"/>`).join("")}
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--accent)"/>
    <text x="${PL}" y="${H-6}" font-size="9.5" fill="var(--muted)">${ds(t0)}</text><text x="${W-PR}" y="${H-6}" font-size="9.5" fill="var(--muted)" text-anchor="end">${ds(t1)}</text></svg>
  ${traj?`<div class="legend"><span><i class="lg-a"></i>Tes mesures</span><span><i class="lg-t"></i>Trajectoire visée</span></div>`:""}`;
}
function trajInfo(){
  const pr=S.profile,o=pr.obj||{},gi=goalInfo();
  if(gi.none||pr.goal==="douceur"||!gi.end||!o.setAt)return null;
  const traj={t0:o.setAt,v0:gi.start,t1:gi.end,v1:gi.target};
  const sr=series();if(!sr.length)return {traj};
  const lastT=new Date(sr[sr.length-1].d).getTime(),f=Math.max(0,Math.min(1,(lastT-traj.t0)/(traj.t1-traj.t0)));
  const expected=traj.v0+(traj.v1-traj.v0)*f,delta=(gi.cur-expected)*gi.G.dir;
  return {traj,expected,delta};
}

/* ---------- Statistiques ---------- */
function weekMap(){const m={};S.sessions.forEach(s=>{const k=dkey(monday(new Date(s.d)));m[k]=(m[k]||0)+1});return m}
function stats(){
  const m=weekMap(),g=S.profile.days,now=monday(new Date());
  let cur=0,w=new Date(now);if((m[dkey(w)]||0)<g)w=addDays(w,-7);
  while((m[dkey(w)]||0)>=g){cur++;w=addDays(w,-7)}
  const keys=Object.keys(m).sort();let best=0,run=0,prev=null;
  keys.forEach(k=>{const ok=m[k]>=g;const d=new Date(k+"T00:00");
    if(ok){run=(prev&&(d-prev)/864e5<=7.5&&run>0)?run+1:1;best=Math.max(best,run);prev=d}else{run=0;prev=null}});
  const xp=S.sessions.reduce((a,s)=>a+(s.xp||0),0)+(S.bonus||[]).reduce((a,b)=>a+(b.xp||0),0)+stepXP(),min=S.sessions.reduce((a,s)=>a+(s.min||0),0);
  return {n:S.sessions.length,cur,best:Math.max(best,cur),xp,min,thisWeek:m[dkey(now)]||0,
    early:S.sessions.some(s=>new Date(s.d).getHours()<9),pal:Math.floor(S.palier),steps10k:Object.values(STEPS).some(v=>v>=10000),chal:Object.keys(S.challenges||{}).length,gp:(()=>{const g=goalInfo();return g.none?0:g.reached?1:g.pct})()};
}
function level(xp){let i=0;LEVELS.forEach((l,j)=>{if(xp>=l[0])i=j});const nx=LEVELS[i+1];
  return {i:i+1,name:LEVELS[i][1],from:LEVELS[i][0],to:nx?nx[0]:null,next:nx?nx[1]:null}}

/* ---------- Délai réaliste pour l'objectif ---------- */
const STD_WEEKS=[[4,"1 mois"],[8,"2 mois"],[12,"3 mois"],[24,"6 mois"]];
function weekOpts(w){const o=STD_WEEKS.slice();if(w&&!o.some(x=>x[0]==w))o.push([w,`${w} semaines`]);return o.sort((a,b)=>a[0]-b[0])}
function safeRate(k,start,days){
  if(k==="poids")return Math.max(.5,Math.min(1,start*.01));
  if(k==="force")return Math.max(1,start*.1);
  if(k==="tonus")return .75;
  if(k==="forme")return Math.max(5,start*.1);
  if(k==="douceur")return days||3;
  return 1;
}
const paceDecision={};
function paceRead(k){
  const num=id=>{const el=document.getElementById(id);const x=el?parseFloat(String(el.value).replace(",",".")):NaN;return isFinite(x)&&x>=0?x:null};
  const G=GOALS[k],start=k==="douceur"?0:num("gs-"+k),target=num("gt-"+k);
  const w=+(document.querySelector(`input[name="gw-${k}"]:checked`)?.value||8);
  const days=+(document.querySelector('input[name="days"]:checked')?.value||3);
  return {G,start,target,w,days};
}
function paceInfo(k){
  const {G,start,target,w,days}=paceRead(k);
  if(target==null||start==null)return null;
  const diff=(target-start)*G.dir;
  if(diff<=0)return {bad:k==="douceur"?"Indique un nombre de séances.":`Ta cible doit être ${G.dir<0?"plus basse":"plus haute"} que ton point de départ.`};
  const rate=diff/w,safe=safeRate(k,start,days),sug=Math.max(1,Math.ceil(diff/safe));
  return {G,rate,safe,w,sug,too:rate>safe*1.05,end:addDays(new Date(),w*7),sugEnd:addDays(new Date(),sug*7)};
}
const dfr=d=>d.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
function paceRender(k){
  const box=document.getElementById("pace-"+k);if(!box)return;
  const p=paceInfo(k);box.className="pacebox";
  if(!p){box.innerHTML="";return}
  if(p.bad){box.className="pacebox too";box.innerHTML=`<p>${p.bad}</p>`;return}
  const u=p.G.unit,per=k==="douceur"?"séances":u;
  if(!p.too){delete paceDecision[k];box.innerHTML=`<p><b>Délai réaliste.</b> Rythme : ${fmtN(p.rate,per)} par semaine, objectif atteint vers le ${dfr(p.end)}.</p>`;return}
  box.className="pacebox too";
  const kept=paceDecision[k]==="keep";
  box.innerHTML=`<p><b>Ce délai est très ambitieux.</b> Il faudrait ${fmtN(p.rate,per)} par semaine. Un rythme ${k==="poids"?"sain et durable":"réaliste"} pour toi, c'est environ ${fmtN(p.safe,per)} par semaine.</p>
    <p>Délai conseillé : <b>${p.sug} semaines</b>, soit vers le ${dfr(p.sugEnd)}.</p>
    ${kept?`<p class="muted">Tu gardes ton délai de ${p.w} semaines. L'appli te montrera quand même le rythme conseillé.</p>`:""}
    <div class="row"><button type="button" class="btn primary small" data-pace-ok="${k}" data-weeks="${p.sug}">Valider ${p.sug} semaines</button>${kept?"":`<button type="button" class="btn ghost small" data-pace-keep="${k}">Garder ${p.w} semaines</button>`}</div>`;
}
function paceOk(){
  const k=document.querySelector('input[name="goal"]:checked')?.value;if(!k)return true;
  const p=paceInfo(k);
  if(!p||p.bad){if(p&&p.bad){const b=document.getElementById("pace-"+k);paceRender(k);b.classList.add("need");b.scrollIntoView({block:"center",behavior:"smooth"});return false}return true}
  if(p.too&&paceDecision[k]!=="keep"){paceRender(k);const b=document.getElementById("pace-"+k);b.classList.add("need");b.scrollIntoView({block:"center",behavior:"smooth"});return false}
  return true;
}
document.addEventListener("input",e=>{const m=(e.target.id||"").match(/^g[st]-(\w+)$/);if(m){delete paceDecision[m[1]];paceRender(m[1])}});
document.addEventListener("change",e=>{
  const n=e.target.name||"";
  if(n.startsWith("gw-")){const k=n.slice(3);delete paceDecision[k];paceRender(k)}
  if(n==="goal")paceRender(e.target.value);
  if(n==="days"){const k=document.querySelector('input[name="goal"]:checked')?.value;if(k)paceRender(k)}
});
document.addEventListener("click",e=>{
  const ok=e.target.closest("[data-pace-ok]"),keep=e.target.closest("[data-pace-keep]");
  if(ok){const k=ok.dataset.paceOk,w=+ok.dataset.weeks;const wrap=document.getElementById("gwo-"+k);
    wrap.innerHTML=optGroup("gw-"+k,"radio",weekOpts(w),w);delete paceDecision[k];paceRender(k)}
  if(keep){paceDecision[keep.dataset.paceKeep]="keep";paceRender(keep.dataset.paceKeep)}
});

/* ---------- Trajectoire : en avance ou en retard ---------- */
function trackLine(){

  if(d<(G.unit==="kg"?.3:G.unit==="cm"?.5:1))return `<p class="track ahead">Tu es pile sur ta trajectoire.</p>`;

}

/* ---------- Défi de la semaine ---------- */
function weekSessions(ws){const we=addDays(ws,7);return S.sessions.filter(x=>{const d=new Date(x.d);return d>=ws&&d<we})}
function weekSteps(ws){let t=0;for(let i=0;i<7;i++)t+=STEPS[dkey(addDays(ws,i))]||0;return t}
const CHALLENGES=[
  {id:"all",t:()=>`Fais tes ${S.profile.days} séances de la semaine`,ok:ws=>weekSessions(ws).length>=S.profile.days},
  {id:"early",t:()=>"Fais une séance avant 9 h",ok:ws=>weekSessions(ws).some(x=>new Date(x.d).getHours()<9)},
  {id:"long",t:()=>"Fais une séance d'au moins 20 minutes",ok:ws=>weekSessions(ws).some(x=>x.min>=20)},
  {id:"streak2",t:()=>"Entraîne-toi deux jours de suite",ok:ws=>{const ds=new Set(weekSessions(ws).map(x=>dkey(new Date(x.d))));return [...ds].some(k=>ds.has(dkey(addDays(new Date(k+"T12:00"),1))))}},
  {id:"measure",t:()=>`Note ta mesure de la semaine (${(GOALS[S.profile.goal]||GOALS.forme).metric.toLowerCase()})`,ok:ws=>series().some(x=>{const d=new Date(x.d);return d>=ws&&d<addDays(ws,7)}),skip:()=>S.profile.goal==="douceur"},
  {id:"weekend",t:()=>"Fais une séance le week-end",ok:ws=>weekSessions(ws).some(x=>[0,6].includes(new Date(x.d).getDay()))},
  {id:"steps",t:()=>"Marche 50 000 pas dans la semaine",ok:ws=>weekSteps(ws)>=50000,skip:()=>!stepsOn()},
  {id:"hard",t:()=>"Termine une séance complète sans t'arrêter avant la fin",ok:ws=>weekSessions(ws).some(x=>x.full)}
];
function challengeFor(ws){
  const list=CHALLENGES.filter(c=>!(c.skip&&c.skip()));
  const n=Math.floor(ws.getTime()/(7*864e5));return list[((n%list.length)+list.length)%list.length];
}
function checkChallenge(quiet){
  if(!S||!S.profile)return false;
  const ws=monday(new Date()),k=dkey(ws),c=challengeFor(ws);
  S.challenges=S.challenges||{};
  if(S.challenges[k]||!c.ok(ws))return false;
  S.challenges[k]=c.id;S.bonus=S.bonus||[];S.bonus.push({d:new Date().toISOString(),xp:100,why:"Défi : "+c.t()});
  if(!quiet)save();
  return true;
}
function challengeCard(){
  const ws=monday(new Date()),k=dkey(ws),c=challengeFor(ws),done=!!(S.challenges||{})[k];
  const daysLeft=7-((new Date().getDay()+6)%7);
  return `<section class="card chal ${done?"done":""}"><p class="eyebrow">Défi de la semaine · +100 XP</p><h3>${c.t()}</h3>
    <p class="${done?"ok":"muted"}">${done?"Défi réussi, bravo ! Les 100 XP sont à toi.":`Encore ${daysLeft} jour${daysLeft>1?"s":""} pour le relever. Il se valide tout seul.`}</p></section>`;
}

/* ---------- Bilan du dimanche ---------- */
function recapCard(){
  const now=new Date(),dow=now.getDay();
  if(dow!==0&&dow!==1)return "";
  const ws=dow===0?monday(now):addDays(monday(now),-7),we=addDays(ws,7);
  const ss=weekSessions(ws),min=ss.reduce((a,x)=>a+(x.min||0),0),xp=ss.reduce((a,x)=>a+(x.xp||0),0);
  const sr=series().filter(x=>{const d=new Date(x.d);return d<we});
  const before=sr.filter(x=>new Date(x.d)<ws),inW=sr.filter(x=>new Date(x.d)>=ws);
  const G=(GOALS[S.profile.goal]||GOALS.forme);
  let mTxt="";if(inW.length&&(before.length||inW.length>1)){const a=(before.length?before[before.length-1]:inW[0]).v,b=inW[inW.length-1].v,d=b-a;mTxt=`${G.metric} : ${d>0?"+":""}${fmtN(d,G.unit)} sur la semaine.`}
  const steps=stepsOn()?weekSteps(ws):0,chal=(S.challenges||{})[dkey(ws)],goal=S.profile.days;
  const verdict=ss.length>=goal?`Semaine réussie : ${ss.length} séance${ss.length>1?"s":""} sur ${goal}. Tu construis une vraie habitude, je suis fier de toi.`
    :ss.length>0?`${ss.length} séance${ss.length>1?"s":""} sur ${goal}. C'est un début : la semaine prochaine, on vise ${goal}. Bloque les créneaux dès lundi.`
    :"Semaine blanche. Ça arrive. On repart lundi avec une première séance courte, sans pression.";
  return `<section class="card recap"><p class="eyebrow">Bilan de la semaine du ${ws.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}</p>
    <div class="coach-head">${COACH_AV}<p>${verdict}</p></div>
    <div class="stats num"><div class="stat"><b>${ss.length}/${goal}</b><span>séances</span></div><div class="stat"><b>${min}</b><span>minutes</span></div><div class="stat"><b>${xp+(chal?100:0)}</b><span>XP gagnés</span></div></div>
    ${mTxt?`<p>${mTxt}</p>`:""}${steps?`<p>${steps.toLocaleString("fr-FR")} pas dans la semaine.</p>`:""}
    <p class="${chal?"ok":"muted"}">${chal?"Défi de la semaine réussi.":"Défi de la semaine non relevé."}</p></section>`;
}

function mealItems(m){return (m[4]||"").split(";").filter(Boolean).map(x=>{const i=x.lastIndexOf(":");const f=FOOD.find(y=>y.n===x.slice(0,i));return f?{f,g:+x.slice(i+1)}:null}).filter(Boolean)}

function mealsFor(slot){
  const veg=!!(S.mealPrefs&&S.mealPrefs.veg),simple=!!(S.mealPrefs&&S.mealPrefs.simple),g=S.profile.goal;
  let l=MEALS[slot].filter(m=>(!veg||m[3].includes("v"))&&(!simple||m[3].includes("s")));
  if(!l.length)l=MEALS[slot].filter(m=>!veg||m[3].includes("v"));
  const pref=g==="poids"||g==="tonus"?"l":g==="force"?"p":"";
  if(pref){const a=l.filter(m=>m[3].includes(pref));if(a.length>=3)l=a}
  return l;
}

function needs(){
  const b=S.profile.body;if(!bodyOk())return null;
  const w=curWeight(),h=b.height,a=b.age,pr=S.profile;
  const bmr=Math.round(10*w+6.25*h-5*a+(b.sex==="f"?-161:5));
  const daily=Math.round(bmr*(+b.act));
  const declicWeek=Math.round(pr.days*pr.minutes/60*w*5);
  const sportWeek=Math.round((b.sport||0)*w*6);
  const sportDay=Math.round((declicWeek+sportWeek)/7);
  const tdee=daily+sportDay;
  const floor=Math.max(bmr,b.sex==="f"?1200:1500);
  let target=tdee,adj="Maintien : tu manges autant que tu dépenses.";
  if(pr.goal==="poids"){
    const o=pr.obj;let def=tdee*.15;
    if(o&&o.target!=null&&o.start!=null&&o.weeks&&o.start>o.target)def=(o.start-o.target)/o.weeks*7700/7;
    def=Math.min(def,tdee*.25,1000);
    target=Math.max(floor,Math.round(tdee-def));
    adj=`Déficit de ${fmt(tdee-target)} kcal par jour pour perdre du poids${target===floor?" (plafonné : on ne descend pas sous ton métabolisme de base)":""}. Environ ${fmt1((tdee-target)*7/7700)} kg par semaine.`;

  const p=Math.round(refW*pk),l=Math.round(target*.3/9),f=30,c=Math.max(0,Math.round((target-p*4-l*9-f*2)/4));
  return {w,bmr,daily,declicWeek,sportWeek,sportDay,tdee,target,adj,p,c,l,f,pk,refW};
}

    <tr class="tot"><td>Ton objectif</td><td>${fmt(n.target)} kcal/j</td></tr>
  </tbody></table>
  <table class="ntab num"><thead><tr><th>Par jour</th><th>Objectif</th></tr></thead><tbody>
    <tr><td>Protéines<small class="muted">${n.pk} g par kg${n.refW<n.w?` de poids de référence (${fmt(n.refW)} kg)`:""}, pour garder tes muscles</small></td><td>${fmt(n.p)} g</td></tr>
    <tr><td>Lipides<small class="muted">30 % des calories</small></td><td>${fmt(n.l)} g</td></tr>
    <tr><td>Glucides<small class="muted">Le reste de tes calories, priorité aux complets</small></td><td>${fmt(n.c)} g</td></tr>
    <tr><td>Fibres<small class="muted">Recommandation pour un adulte</small></td><td>${fmt(n.f)} g</td></tr>
  </tbody></table>
  <p class="muted" style="font-size:.8rem">Estimation (formule de Mifflin-St Jeor). Si ton poids ne bouge pas comme prévu après 2 à 3 semaines, ajuste de 100 à 200 kcal. Le poids utilisé est ta dernière pesée.</p>
  <button class="btn ghost small" data-tab="profile" data-goto="prof">Modifier mon profil</button></section>`;
}
function foodTableCard(){
  const cats=["all",...FCATS,...(((S.myFoods)||[]).length?["Mes aliments"]:[])];
  const rows=allFoods().map((f,i)=>({f,i})).filter(({f})=>foodCat==="all"||f.cat===foodCat);
  return `<details class="card" id="ftable" ${foodTableOpen?"open":""}><summary><h2 style="display:inline">Table des valeurs</h2> <span class="muted" style="font-size:.85rem">pour 100 g</span></summary>
  <div class="opts" style="margin-top:12px">${cats.map(c=>`<button type="button" class="chipbtn ${foodCat===c?"on":""}" data-fcat="${esc(c)}">${c==="all"?"Tout":esc(c)}</button>`).join("")}</div>
  <div class="tscroll"><table class="ftab num"><thead><tr><th>Aliment</th><th>kcal</th><th>Prot.</th><th>Gluc.</th><th>Lip.</th><th>Fib.</th></tr></thead><tbody>
  ${rows.map(({f,i})=>`<tr data-food="${i}" tabindex="0"><td>${esc(f.n)}</td><td>${fmt(f.k)}</td><td>${fmt1(f.p)}</td><td>${fmt1(f.c)}</td><td>${fmt1(f.l)}</td><td>${fmt1(f.f)}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="muted" style="font-size:.8rem">Touche une ligne pour l'ajouter à ton journal. Valeurs moyennes ; regarde l'étiquette pour un produit précis.</p>
  <details ${myFoodOpen?"open":""} id="myfoodbox"><summary><b>Créer mon aliment</b></summary>
  <form id="myfood" class="fsel" style="margin-top:10px"><div class="field"><label for="mf-n">Nom</label><input class="text" id="mf-n" required maxlength="50" placeholder="Ex. : mon granola"></div>
  <p class="muted" style="font-size:.85rem">Valeurs pour 100 g (sur l'étiquette).</p>
  <div class="grid2">${[["k","kcal",1],["p","Protéines (g)",.1],["c","Glucides (g)",.1],["l","Lipides (g)",.1],["f","Fibres (g)",.1],["pg","Portion (g)",1]].map(([id,l,s])=>`<div><label for="mf-${id}">${l}</label><input class="text num" id="mf-${id}" type="number" inputmode="decimal" min="0" max="${id==="k"?900:id==="pg"?2000:100}" step="${s}" ${id==="k"?"required":""} value="${id==="pg"?100:""}"></div>`).join("")}</div>
  <button class="btn primary small" type="submit">Enregistrer l'aliment</button></form></details>
  </details>`;
}
function bodyNeededCard(){
  return `<section class="card"><p class="eyebrow">Avant de compter</p><h2>Complète ton profil</h2><p class="muted">Avec ton sexe, ton âge, ta taille, ton poids et ton activité, Déclic calcule ta dépense de la journée et de la semaine, puis tes objectifs en calories et en nutriments.</p>
  <form id="bodyf" class="fsel">${bodyFields({weight:lastWeight()??undefined})}<button class="btn primary" type="submit">Calculer mes besoins</button></form></section>`;
}
function nutrition(){
  if(!bodyOk())return `${header("Nutrition")}${bodyNeededCard()}${mealCard()}${shopOpen?shopCard():""}`;
  const n=needs();
  return `${header("Nutrition")}${counterCard(n)}${foodAddCard()}${journalCard()}${weekKcalCard(n)}${needsCard(n)}${foodTableCard()}${mealCard()}${shopOpen?shopCard():""}`;
}
function pickFood(i){
  const f=allFoods()[i];if(!f)return;
  const m=document.querySelector('input[name="fmeal"]:checked')?.value;
  foodSel={f,g:f.pg,m:m||(foodSel&&foodSel.m)||defMeal()};foodQ=f.n;
  if(tab!=="nutrition")tab="nutrition";
  render();setTimeout(()=>{const el=$("#fadd");if(el)el.scrollIntoView({block:"start",behavior:"smooth"})},30);
}
document.addEventListener("input",e=>{
  if(e.target.id==="fq"){foodQ=e.target.value;if(foodSel){foodSel=null;const fm=$("#fform");if(fm)fm.remove()}$("#fres").innerHTML=foodResults()}
  if(e.target.id==="fg"){const p=$("#fprev");if(p)p.innerHTML=foodPreview()}
});
document.addEventListener("toggle",e=>{if(e.target.id==="ftable")foodTableOpen=e.target.open;if(e.target.id==="myfoodbox")myFoodOpen=e.target.open},true);
document.addEventListener("keydown",e=>{const r=e.target.closest&&e.target.closest("tr[data-food]");if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pickFood(+r.dataset.food)}});
document.addEventListener("click",e=>{
  const fd=e.target.closest("[data-food]");if(fd){pickFood(+fd.dataset.food);return}
  const fg=e.target.closest("[data-fg]");if(fg){const i=$("#fg");if(i){i.value=fg.dataset.fg;$("#fprev").innerHTML=foodPreview()}return}
  const del=e.target.closest("[data-fdel]");if(del){const k=fday();S.food[k]=(S.food[k]||[]).filter(x=>String(x.id)!==del.dataset.fdel);if(!S.food[k].length)delete S.food[k];save();render();return}
  const fc=e.target.closest("[data-fcat]");if(fc){foodCat=fc.dataset.fcat;render();return}
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a==="food-cancel"){foodSel=null;foodQ="";render();setTimeout(()=>{const q=$("#fq");if(q)q.focus()},30)}
  if(a==="fday-"||a==="fday+"){foodOff=Math.min(0,Math.max(-89,foodOff+(a==="fday+"?1:-1)));foodSel=null;render()}
});
document.addEventListener("submit",e=>{
  const id=e.target.id;if(id!=="fform"&&id!=="myfood"&&id!=="bodyf")return;e.preventDefault();
  if(id==="fform"&&foodSel){
    const g=parseFloat(String($("#fg").value).replace(",","."));if(!(g>0&&g<=3000))return;
    const m=document.querySelector('input[name="fmeal"]:checked')?.value||defMeal(),v=per(foodSel.f,g),k=fday();
    S.food=S.food||{};S.food[k]=(S.food[k]||[]).concat([{id:Date.now(),n:foodSel.f.n,m,g,...Object.fromEntries(Object.entries(v).map(([x,y])=>[x,Math.round(y*10)/10]))}]);
    const keep=Object.keys(S.food).sort().slice(-120);S.food=Object.fromEntries(keep.map(x=>[x,S.food[x]]));
    foodSel=null;foodQ="";save();render();
    setTimeout(()=>{const q=$("#fq");if(q)q.scrollIntoView({block:"center"})},30);
  }
  if(id==="myfood"){
    const n=id2=>{const x=parseFloat(String($("#mf-"+id2).value).replace(",","."));return isFinite(x)&&x>=0?x:0};
    const name=$("#mf-n").value.trim().slice(0,50);if(!name)return;
    S.myFoods=(S.myFoods||[]).filter(f=>f.n!==name).concat([{n:name,k:n("k"),p:n("p"),c:n("c"),l:n("l"),f:n("f"),pg:n("pg")||100,pl:"1 portion"}]);
    foodCat="Mes aliments";myFoodOpen=false;save();render();
  }
  if(id==="bodyf"){const b=readBody();if(!b)return;const prev=lastWeight();S.profile.body=b;syncBodyWeight(prev);save();render();window.scrollTo(0,0)}
});

pushWater();
render();
</script>
