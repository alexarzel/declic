<title>Déclic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout : appli une colonne, barre d'onglets fixe en bas, séance guidée en plein écran. */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --sunk:#E2E8EE; --ink:#0F1C26; --muted:#566775; --line:#D3DCE4;
  --accent:#1D58F2; --accent-soft:#DCE6FF; --on-accent:#FFFFFF;
  --fig-far:#9DB5F7; --heat:#F2611D; --heat-soft:#FFE6D9; --good:#0F9A64; --rest:#0B8C8C; --rest-soft:#D5F1F0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1117; --surface:#131D26; --sunk:#0F171E; --ink:#E6EDF3; --muted:#8D9CA8; --line:#24323E;
  --accent:#5D87FF; --fig-far:#34508F; --accent-soft:#1A2950; --on-accent:#08101A;
  --heat:#FF8550; --heat-soft:#3A2115; --good:#2BC88A; --rest:#2CC4C4; --rest-soft:#0F3133; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1117; --surface:#131D26; --sunk:#0F171E; --ink:#E6EDF3; --muted:#8D9CA8; --line:#24323E;
  --accent:#5D87FF; --fig-far:#34508F; --accent-soft:#1A2950; --on-accent:#08101A;
  --heat:#FF8550; --heat-soft:#3A2115; --good:#2BC88A; --rest:#2CC4C4; --rest-soft:#0F3133; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible+span,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.1rem;font-weight:800}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:1rem;background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.big{width:100%;padding:18px;font-size:1.15rem;font-family:var(--display);letter-spacing:.04em;text-transform:uppercase}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.chip.heat{background:var(--heat-soft);color:var(--heat)}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sync{font-size:.72rem;color:var(--muted)}

/* hero seance */
.hero{background:var(--accent);color:var(--on-accent);border:0;position:relative;overflow:hidden}
.hero .eyebrow{color:inherit;opacity:.8}
.hero h1{font-size:2.6rem}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;font-weight:600}
.hero .meta b{font-family:var(--display);font-size:1.6rem;display:block;line-height:1}
.hero .meta span{font-size:.75rem;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.hero .btn{background:var(--on-accent);color:var(--accent)}
.hero svg.stripes{position:absolute;right:-20px;top:-10px;opacity:.14;pointer-events:none}

/* semaine */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);font-weight:600}
.dot{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center}
.dot.done{background:var(--good);color:#fff}
.dot.today{box-shadow:0 0 0 2px var(--accent) inset}
.ring{flex:none}
.streak{display:flex;gap:14px;align-items:center}
.streak .n{font-family:var(--display);font-size:2.6rem;font-weight:800;color:var(--heat);line-height:1}

.list{display:flex;flex-direction:column}
.ex{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .dose{font-family:var(--display);font-weight:700;font-size:1.15rem;white-space:nowrap}
.quote{font-family:var(--display);font-size:1.35rem;font-weight:600;line-height:1.2}

/* progres */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:12px}
.stat b{font-family:var(--display);font-size:1.8rem;display:block;line-height:1}
.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.xpbar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.heat-grid{display:grid;grid-template-columns:auto repeat(10,1fr);gap:4px;font-size:.65rem;color:var(--muted);align-items:center}
.cell{aspect-ratio:1;border-radius:4px;background:var(--sunk);max-width:100%}
.cell.on{background:var(--good)}
.cell.future{background:transparent;border:1px dashed var(--line)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{border-radius:12px;padding:10px;text-align:center;background:var(--sunk);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem;line-height:1.25}
.badge .medal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--line);color:var(--muted)}
.badge.got .medal{background:var(--heat);color:#fff}
.badge:not(.got){opacity:.6}
.hist{display:flex;flex-direction:column}
.hist .h{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem;gap:10px}
.chart{width:100%;height:auto;display:block}

/* formulaires */
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lab{font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.text{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{font-family:var(--display);font-size:1.6rem;min-width:3ch;text-align:center}
.note{font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:12px;padding:12px}

/* onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:560px}
nav.tabs button{background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}

/* seance plein écran */
.player{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.player.rest{background:var(--rest-soft)}
.player .pin{flex:1;display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px;min-height:0}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.player.rest .prog i{background:var(--rest)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;min-height:0;overflow-y:auto}
.stage .kind{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.player.rest .stage .kind{color:var(--rest)}
.stage h1{font-size:2.6rem}
.big{font-family:var(--display);font-weight:800;font-size:clamp(5rem,30vw,9rem);line-height:.9;font-variant-numeric:tabular-nums}
.big small{font-size:.32em;font-weight:700;display:block;letter-spacing:.04em}
.cue{max-width:34ch;color:var(--muted)}
.next{font-size:.9rem;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}
.controls .btn{padding:16px 8px}
.confirm{display:flex;flex-direction:column;gap:10px}
.rate{display:grid;gap:10px}
.rate button{text-align:left;display:flex;flex-direction:column;gap:2px}
.rate button span{font-weight:400;font-size:.85rem;color:var(--muted)}
.rate button.primary span{color:inherit;opacity:.85}
.won{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
/* objectif */
.goal{border-color:var(--good)}
.gbar{height:14px;border-radius:99px;background:var(--sunk);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--good);border-radius:99px;min-width:14px}
.ok{color:var(--good);font-weight:600}
.warn{color:var(--heat);font-weight:600;font-size:.9rem}
.goalbox{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:12px;padding:12px}
.goalbox label{font-weight:500;font-size:.92rem}
.upd{border-color:var(--accent);background:var(--accent-soft)}
/* coach */
.coach{gap:10px}
.coach-head{display:flex;gap:12px;align-items:center}
.coach-av{flex:none;width:48px;height:48px}
.bubble{background:var(--sunk);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:.95rem}
.bubble.me{background:var(--accent-soft);color:var(--ink);border-radius:14px 4px 14px 14px;align-self:flex-end;max-width:85%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:.85rem;font-weight:600}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days7 .opt span{padding:10px 0;text-align:center}
.pacebox:empty{display:none}
.pacebox{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:.9rem;background:var(--surface);border:1.5px solid var(--good)}
.pacebox.too{border-color:var(--heat)}
.pacebox.need{box-shadow:0 0 0 3px var(--heat-soft)}
.pacebox .row{flex-wrap:wrap;gap:8px}
/* graphique */
.legend{display:flex;gap:16px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend i.lg-t{border-top:2px dashed var(--good)}
.track{font-weight:600;font-size:.9rem}
.track.ahead{color:var(--good)}.track.behind{color:var(--heat)}
/* repas, défis, pas, bilan */
.tips{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.chal{border-color:var(--heat)}
.chal.done{border-color:var(--good)}
.recap{background:var(--accent-soft);border-color:var(--accent)}
.recap .stats .stat{background:var(--surface)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px}
.bars .b{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:.68rem;color:var(--muted)}
.bars .b i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--sunk)}
.bars .b i.ok{background:var(--good)}.bars .b i.part{background:var(--accent)}
textarea.text{resize:vertical;min-height:90px;font-family:ui-monospace,monospace;font-size:.8rem}
.meal h3{font-size:1.3rem}
.meal .ing{font-size:.92rem}
.mealplan{display:flex;flex-direction:column;gap:10px}
.mealplan div{border-top:1px solid var(--line);padding-top:8px}
.ai-out{white-space:pre-line;font-size:.92rem}
/* démos & musique */
.demo{width:100%;max-width:220px;height:auto;display:block;margin:0 auto;background:var(--sunk);border-radius:12px}
.demo.sm{max-width:180px}
.player .demo{max-width:min(240px,32vh);background:var(--surface)}
.player.rest .demo{background:var(--surface)}
details.ex{display:block}
details.ex summary{list-style:none;display:flex;justify-content:space-between;gap:12px;cursor:pointer}
details.ex summary::-webkit-details-marker{display:none}
details.ex .how{font-size:.78rem;color:var(--accent);font-weight:600}
details.ex[open] .how{color:var(--muted)}
.demo-box{display:flex;flex-direction:column;gap:8px;padding-top:10px;align-items:center;text-align:center}
.demo-box a,.vid{font-size:.85rem;color:var(--accent);font-weight:600}
.mbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}
.mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upl{text-align:center;display:block}
a.btn{text-decoration:none;color:inherit;display:inline-block}
a.btn.small{flex:none}
.opt-a{padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:.85rem;color:var(--ink);text-decoration:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.player .stage .big{font-size:clamp(3.6rem,18vw,6.5rem)}
.player .stage h1{font-size:2.1rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<div id="player" class="player" hidden></div>

<script>
"use strict";
/* ---------- Données ---------- */
const EX = {
  squat:{n:"Squats",m:"reps",b:8,k:.8,x:30,c:"Pieds largeur d'épaules. Descends comme pour t'asseoir, dos droit, talons au sol."},
  squat_goblet:{n:"Squats goblet (haltère)",m:"reps",b:8,k:.6,x:22,c:"Haltère tenu contre la poitrine, coudes vers le bas. Descends en gardant le buste fier."},
  squat_saute:{n:"Squats sautés",m:"reps",b:6,k:.6,x:22,c:"Descends en squat puis pousse fort pour décoller. Atterris en souplesse."},
  fente:{n:"Fentes alternées",m:"reps",b:6,k:.5,x:16,s:1,c:"Grand pas en avant, le genou arrière frôle le sol. Reviens et change de jambe."},
  fente_sautee:{n:"Fentes sautées",m:"reps",b:5,k:.4,x:14,s:1,c:"Depuis la fente, saute et inverse les jambes en l'air."},
  pont:{n:"Pont fessier",m:"reps",b:10,k:1,x:30,c:"Allongé sur le dos, pieds au sol. Monte le bassin en serrant les fessiers, redescends lentement."},
  pont1:{n:"Pont fessier sur une jambe",m:"reps",b:6,k:.5,x:16,s:1,c:"Une jambe tendue en l'air, pousse sur l'autre talon pour monter le bassin."},
  planche:{n:"Gainage planche",m:"time",b:20,k:3,x:90,c:"Sur les avant-bras, corps aligné des épaules aux talons. Ventre serré, respire."},
  lat:{n:"Gainage latéral",m:"time",b:20,k:2.5,x:70,c:"Sur un avant-bras, bassin haut. Change de côté à la moitié du temps."},
  jacks:{n:"Jumping jacks",m:"time",b:25,k:2,x:50,c:"Saute en écartant bras et jambes, puis reviens. Garde un rythme régulier."},
  genoux:{n:"Montées de genoux",m:"time",b:20,k:2,x:45,c:"Cours sur place en montant les genoux à hauteur de hanches."},
  mountain:{n:"Mountain climbers",m:"time",b:15,k:2,x:45,c:"En position de pompe, ramène les genoux vers la poitrine en alternance, vite."},
  burpee_doux:{n:"Burpees sans saut",m:"reps",b:5,k:.5,x:12,c:"Mains au sol, recule les pieds un par un, reviens, relève-toi."},
  burpee:{n:"Burpees",m:"reps",b:5,k:.5,x:15,c:"Squat, mains au sol, saute en planche, pompe facultative, reviens et saute."},
  pompe_incl:{n:"Pompes inclinées",m:"reps",b:6,k:1,x:20,c:"Mains sur une table ou un plan de travail. Corps gainé, poitrine vers le bord."},
  pompe_gen:{n:"Pompes sur les genoux",m:"reps",b:6,k:.8,x:22,c:"Genoux au sol, mains sous les épaules. Descends la poitrine près du sol."},
  pompe:{n:"Pompes",m:"reps",b:5,k:.7,x:30,c:"Corps droit comme une planche, coudes à 45°. Descends jusqu'à frôler le sol."},
  superman:{n:"Superman",m:"time",b:15,k:2,x:45,c:"À plat ventre, décolle bras et jambes du sol et tiens. Regard vers le sol."},
  rowing:{n:"Rowing haltère",m:"reps",b:8,k:.6,x:20,s:1,c:"Penché, dos plat, tire l'haltère vers la hanche en serrant l'omoplate."},
  tirage:{n:"Tirage élastique",m:"reps",b:10,k:.7,x:25,c:"Élastique accroché devant toi, tire les coudes vers l'arrière, poitrine sortie."},
  dips:{n:"Dips sur chaise",m:"reps",b:5,k:.7,x:20,c:"Mains au bord d'une chaise stable, fléchis les coudes vers l'arrière, remonte."},
  velo:{n:"Crunchs vélo",m:"reps",b:10,k:1,x:30,c:"Sur le dos, coude vers le genou opposé en pédalant. Compte chaque côté."},
  deadbug:{n:"Dead bug",m:"reps",b:8,k:.6,x:20,c:"Sur le dos, bras et genoux en l'air. Étends bras et jambe opposés, bas du dos collé au sol."},
  squat_bras:{n:"Squat et bras en l'air",m:"reps",b:8,k:.7,x:25,c:"Descends en squat, puis remonte en tendant les bras vers le plafond. Sans saut."},
  pas_chasses:{n:"Pas chassés latéraux",m:"time",b:25,k:2,x:50,c:"Petits pas rapides sur le côté, trois à droite puis trois à gauche, genoux souples."},
  genoux_marche:{n:"Marche genoux hauts",m:"time",b:25,k:2,x:50,c:"Marche sur place en montant bien les genoux. Balance les bras."},
  pompe_mur:{n:"Pompes contre un mur",m:"reps",b:8,k:1,x:25,c:"Mains au mur à hauteur d'épaules, pieds reculés. Approche la poitrine du mur, repousse."},
  planche_mur:{n:"Gainage incliné au mur",m:"time",b:20,k:3,x:60,c:"Avant-bras contre le mur, corps droit et penché. Serre le ventre et respire."},
  ext_hanche:{n:"Extensions de hanche debout",m:"reps",b:8,k:.6,x:20,s:1,c:"Une main au mur pour l'équilibre, tends une jambe vers l'arrière en serrant la fesse, sans cambrer."},
  genou_coude:{n:"Genou-coude debout",m:"reps",b:10,k:1,x:30,c:"Mains derrière la tête, monte un genou vers le coude opposé. Alterne les côtés."},
  w_debout:{n:"Omoplates en W",m:"reps",b:10,k:.7,x:25,c:"Bras en W, coudes pliés. Tire les coudes vers le bas et l'arrière en serrant les omoplates."},
  dips_sol:{n:"Dips au sol",m:"reps",b:6,k:.7,x:20,c:"Assis, mains au sol derrière toi doigts vers l'avant. Décolle les fesses, plie et tends les coudes."},
  triceps_mur:{n:"Pompes au mur mains serrées",m:"reps",b:8,k:1,x:25,c:"Mains au mur rapprochées, coudes le long du corps. Approche-toi du mur puis repousse."},
  mollets:{n:"Montées sur pointes",m:"reps",b:12,k:1,x:30,c:"Monte sur la pointe des pieds, tiens une seconde, redescends doucement."}

const START={deb:1,int:7,ava:13};
function adapt(id,lim,goal,p){
  const nj=lim.includes("nojump")||goal==="douceur",nf=lim.includes("nofloor");
  const J={squat_saute:"squat",fente_sautee:"fente",burpee:"squat_bras",burpee_doux:"squat_bras",jacks:"pas_chasses",genoux:"genoux_marche"};
  const F={pont:"ext_hanche",pont1:"ext_hanche",planche:"planche_mur",lat:"genou_coude",velo:"genou_coude",deadbug:"genou_coude",superman:"w_debout",mountain:"genoux_marche",burpee:"squat_bras",burpee_doux:"squat_bras",pompe:"pompe_incl",pompe_gen:"pompe_incl"};
  if(nj&&J[id])id=J[id];
  if(nf&&F[id])id=F[id];
  if(nf&&id==="pompe_incl"&&p<3)id="pompe_mur";
  if(nj&&J[id])id=J[id];
  if((S.profile.equip||[]).includes("rien")){
    if(id==="pompe_incl")id="pompe_mur";
    if(id==="dips")id=nf?"triceps_mur":"dips_sol";
  }
  return id;
}
function pick(slot,p,eq){
  const h=eq.includes("halteres"),e=eq.includes("elastique");
  switch(slot){
    case"squat":return p>=12?"squat_saute":h&&p>=4?"squat_goblet":"squat";
    case"fente":return p>=15?"fente_sautee":"fente";
    case"pont":return p>=10?"pont1":"pont";
    case"pompe":return p>=10?"pompe":p>=5?"pompe_gen":"pompe_incl";
    case"dos":return h?"rowing":e?"tirage":"superman";
    case"burpee":return p>=8?"burpee":"burpee_doux";
    case"core":return p>=6?"velo":"deadbug";
    case"bas2":return p>=6?"mollets":"mollets";
    default:return slot;
  }
}
const PLAN={A:["squat","fente","pont","planche","jacks","bas2"],B:["pompe","dos","dips","lat","genoux"],C:["burpee","squat","pompe","mountain","core"]};
function dose(id,p,goal){
  const e=EX[id];let v=e.b+e.k*(p-1);
  if(goal==="force"&&e.m==="reps")v*=1.15;
  v=Math.min(e.x,v);
  return e.m==="time"?Math.max(10,Math.round(v/5)*5):Math.max(3,Math.round(v));
}
function stepSec(st){return st.m==="time"?st.v:st.v*(st.s?2:1)*3}
function buildSession(minOverride){
  const pr=S.profile,goal=pr.goal,lim=pr.lim||[],p=goal==="douceur"?Math.min(10,Math.floor(S.palier)):Math.floor(S.palier),idx=S.sessions.length,type=["A","B","C"][idx%3];
  let plan=PLAN[type].slice();
  if(goal==="poids"&&type!=="A")plan.push("jacks");
  if(goal==="force")plan=plan.filter(x=>x!=="jacks"&&x!=="genoux");
  if(goal==="tonus")plan.push("core");
  const seen=new Set();
  const exs=plan.map(sl=>adapt(pick(sl,p,pr.equip),lim,goal,p)).filter(id=>!seen.has(id)&&seen.add(id)).map(id=>({id,n:EX[id].n,c:EX[id].c+(goal==="tonus"&&EX[id].m==="reps"?" Descends lentement, en 3 secondes.":""),m:EX[id].m,s:EX[id].s,v:dose(id,p,goal)}));
  let rest=p<6?30:p<12?25:20;if(goal==="poids")rest-=5;if(goal==="force")rest+=15;if(goal==="douceur")rest+=15;
  const rr=p>=12?45:60, short=pr.minutes<=10;
  const warm=(short?WARM.slice(0,3):WARM).map(([n,v,c])=>({k:"warm",n,c,m:"time",v}));
  const cool=(short?COOL.slice(2):COOL).map(([n,v,c])=>({k:"cool",n,c,m:"time",v}));
  const make=R=>{
    const st=[...warm];
    for(let r=1;r<=R;r++){exs.forEach((e,i)=>{st.push({k:"work",...e,r,R});
      if(i<exs.length-1)st.push({k:"rest",n:"Récupération",m:"time",v:rest,r,R});
      else if(r<R)st.push({k:"rest",n:"Pause entre les tours",m:"time",v:rr,r,R});});}
    const fin=adapt("genoux",lim,goal,p);if(goal==="poids")st.push({k:"work",id:fin,n:"Finisher : "+EX[fin].n.toLowerCase(),c:EX[fin].c,m:"time",v:p>=8?45:30,r:R,R});
    st.push(...cool);return st;
  };
  const target=minOverride||pr.minutes;let R=1;for(let k=2;k<=6;k++){if(make(k).reduce((a,s)=>a+stepSec(s),0)<=target*60+60)R=k;}
  const steps=make(R),est=Math.round(steps.reduce((a,s)=>a+stepSec(s),0)/60);
  return {type,name:TYPES[type],exs,rounds:R,rest,steps,est,num:idx+1};
}
function doseLabel(e){return e.m==="time"?`${e.v} s`:`${e.v}${e.s?" / côté":""}`}

/* ---------- Objectif ---------- */
function series(){const g=S.profile.goal;if(g==="poids")return (S.weights||[]).map(w=>({d:w.d,v:w.kg}));return ((S.measures||{})[g])||[]}
function goalInfo(){
  const pr=S.profile,G=GOALS[pr.goal]||GOALS.forme,o=pr.obj||{};
  if(!o.target)return {G,none:true};
  let start=+o.start||0,cur,target=+o.target;
  if(pr.goal==="douceur"){start=0;cur=S.sessions.filter(x=>new Date(x.d).getTime()>=(o.setAt||0)).length}
  else{const sr=series();cur=sr.length?sr[sr.length-1].v:start}
  const span=target-start,pct=span===0?1:Math.max(0,Math.min(1,(cur-start)/span));
  const reached=G.dir>0?cur>=target:cur<=target;
  const end=o.setAt&&o.weeks?o.setAt+o.weeks*7*864e5:null,wl=end?Math.max(0,(end-Date.now())/(7*864e5)):null;
  const left=Math.abs(target-cur),perWeek=wl&&wl>.5?left/wl:null;
  return {G,start,cur,target,pct,reached,end,wl,left,perWeek};
}
const fmtN=(v,u)=>`${String(Math.round(v*10)/10).replace(".",",")} ${u}`;
function chartSvg(sr,unit,target,traj){
  if(sr.length<1||(sr.length<2&&!traj))return "";
  const W=320,H=150,PL=34,PR=12,PT=12,PB=22;
  const ts=sr.map(x=>new Date(x.d).getTime());
  let t0=Math.min(...ts),t1=Math.max(...ts);if(traj){t0=Math.min(t0,traj.t0);t1=Math.max(t1,traj.t1)}if(t1-t0<864e5)t1=t0+864e5;
  const vs=sr.map(x=>x.v).concat(target!=null?[target]:[]).concat(traj?[traj.v0,traj.v1]:[]);
  let mn=Math.min(...vs),mx=Math.max(...vs);const pad=Math.max(.5,(mx-mn)*.08);mn-=pad;mx+=pad;
  const X=t=>PL+(W-PL-PR)*(t-t0)/(t1-t0),Y=v=>PT+(H-PT-PB)*(1-(v-mn)/(mx-mn));
  const r1=v=>String(Math.round(v*10)/10).replace(".",",");
  const ds=t=>new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
  const ticks=[mn+pad,(mn+mx)/2,mx-pad];
  const pts=sr.map(x=>[X(new Date(x.d).getTime()),Y(x.v)]),last=pts[pts.length-1];
  const now=Date.now();
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution : ${unit}${traj?", comparée à la trajectoire visée":""}">
    ${ticks.map(v=>`<line x1="${PL}" x2="${W-PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${PL-4}" y="${Y(v)+3}" font-size="9.5" fill="var(--muted)" text-anchor="end">${r1(v)}</text>`).join("")}
    ${traj?`<line x1="${X(traj.t0)}" y1="${Y(traj.v0)}" x2="${X(traj.t1)}" y2="${Y(traj.v1)}" stroke="var(--good)" stroke-width="2" stroke-dasharray="6 5"/><circle cx="${X(traj.t1)}" cy="${Y(traj.v1)}" r="4" fill="var(--good)"/>`:""}
    ${now>t0&&now<t1?`<line x1="${X(now)}" x2="${X(now)}" y1="${PT}" y2="${H-PB}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/>`:""}
    ${pts.length>1?`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--accent)"/>`).join("")}
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--accent)"/>
    <text x="${PL}" y="${H-6}" font-size="9.5" fill="var(--muted)">${ds(t0)}</text><text x="${W-PR}" y="${H-6}" font-size="9.5" fill="var(--muted)" text-anchor="end">${ds(t1)}</text></svg>
  ${traj?`<div class="legend"><span><i class="lg-a"></i>Tes mesures</span><span><i class="lg-t"></i>Trajectoire visée</span></div>`:""}`;
}
function trajInfo(){
  const pr=S.profile,o=pr.obj||{},gi=goalInfo();
  if(gi.none||pr.goal==="douceur"||!gi.end||!o.setAt)return null;
  const traj={t0:o.setAt,v0:gi.start,t1:gi.end,v1:gi.target};
  const sr=series();if(!sr.length)return {traj};
  const lastT=new Date(sr[sr.length-1].d).getTime(),f=Math.max(0,Math.min(1,(lastT-traj.t0)/(traj.t1-traj.t0)));
  const expected=traj.v0+(traj.v1-traj.v0)*f,delta=(gi.cur-expected)*gi.G.dir;
  return {traj,expected,delta};
}

/* ---------- Statistiques ---------- */
function weekMap(){const m={};S.sessions.forEach(s=>{const k=dkey(monday(new Date(s.d)));m[k]=(m[k]||0)+1});return m}
function stats(){
  const m=weekMap(),g=S.profile.days,now=monday(new Date());
  let cur=0,w=new Date(now);if((m[dkey(w)]||0)<g)w=addDays(w,-7);
  while((m[dkey(w)]||0)>=g){cur++;w=addDays(w,-7)}
  const keys=Object.keys(m).sort();let best=0,run=0,prev=null;
  keys.forEach(k=>{const ok=m[k]>=g;const d=new Date(k+"T00:00");
    if(ok){run=(prev&&(d-prev)/864e5<=7.5&&run>0)?run+1:1;best=Math.max(best,run);prev=d}else{run=0;prev=null}});
  const xp=S.sessions.reduce((a,s)=>a+(s.xp||0),0)+(S.bonus||[]).reduce((a,b)=>a+(b.xp||0),0)+stepXP(),min=S.sessions.reduce((a,s)=>a+(s.min||0),0);
  return {n:S.sessions.length,cur,best:Math.max(best,cur),xp,min,thisWeek:m[dkey(now)]||0,
    early:S.sessions.some(s=>new Date(s.d).getHours()<9),pal:Math.floor(S.palier),steps10k:Object.values(STEPS).some(v=>v>=10000),chal:Object.keys(S.challenges||{}).length,gp:(()=>{const g=goalInfo();return g.none?0:g.reached?1:g.pct})()};
}
function level(xp){let i=0;LEVELS.forEach((l,j)=>{if(xp>=l[0])i=j});const nx=LEVELS[i+1];
  return {i:i+1,name:LEVELS[i][1],from:LEVELS[i][0],to:nx?nx[0]:null,next:nx?nx[1]:null}}

  const st=stats(),lv=level(st.xp);
  return `<div class="top"><div><p class="eyebrow">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</p><h1>${title}</h1></div>
  <span class="chip">Niv. ${lv.i} · ${lv.name}</span></div>`;
}
function ringSvg(done,goal){
  const r=26,c=2*Math.PI*r,f=Math.min(1,done/goal);
  return `<svg class="ring" width="68" height="68" viewBox="0 0 68 68" aria-hidden="true">
  <circle cx="34" cy="34" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="8"/>
  <circle cx="34" cy="34" r="${r}" fill="none" stroke="${f>=1?"var(--good)":"var(--accent)"}" stroke-width="8" stroke-linecap="round" stroke-opacity="${f>0?1:0}" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 34 34)"/>
  <text x="34" y="40" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="19" fill="var(--ink)">${done}/${goal}</text></svg>`;
}
function today(){
  const pr=S.profile,se=buildSession(),st=stats(),mon=monday(new Date()),tk=dkey(new Date());
  const done=new Set(S.sessions.map(s=>dkey(new Date(s.d))));
  const todayDone=done.has(tk);
  const q=QUOTES[Math.floor(Date.now()/864e5)%QUOTES.length];
  const left=Math.max(0,pr.days-st.thisWeek);
  const weekMsg=left===0?"Objectif de la semaine atteint. Tout ce qui vient en plus est du bonus.":`Encore ${left} séance${left>1?"s":""} cette semaine pour ${st.cur>0?"prolonger ta série":"lancer ta série"}.`;
  return `${header(pr.name?`Salut ${esc(pr.name)}`:"Salut")}
  <section class="card hero">
    <svg class="stripes" width="200" height="200" viewBox="0 0 200 200" aria-hidden="true"><g fill="currentColor">${[0,1,2,3,4,5].map(i=>`<rect x="${i*34}" y="0" width="14" height="260" transform="rotate(25 100 100)"/>`).join("")}</g></svg>
    <p class="eyebrow">${todayDone?"Déjà une séance aujourd'hui, bravo":"Ta séance du jour"} · n° ${se.num}</p>
    <h1>${se.name}</h1>
    <div class="meta num"><div><b>≈ ${se.est}</b><span>minutes</span></div><div><b>${se.rounds}</b><span>tour${se.rounds>1?"s":""}</span></div><div><b>${Math.floor(S.palier)}</b><span>palier</span></div></div>
    <button class="btn big" data-act="start">Commencer</button>
  </section>
  ${coachCard(q)}
  ${recapCard()}
  ${goalCard(false)}
  <section class="card">
    <div class="row between"><div><p class="eyebrow">Cette semaine</p><h2>${st.thisWeek} séance${st.thisWeek>1?"s":""} sur ${pr.days}</h2></div>${ringSvg(st.thisWeek,pr.days)}</div>
    <div class="week">${DAYS.map((l,i)=>{const d=addDays(mon,i),k=dkey(d);return `<div class="day"><span class="dot ${done.has(k)?"done":""} ${k===tk?"today":""}">${done.has(k)?"✓":d.getDate()}</span>${l}</div>`}).join("")}</div>
    <p class="muted">${weekMsg}</p>
  </section>
  <section class="card"><div class="streak"><span class="n num">${st.cur}</span><div><h3>semaine${st.cur>1?"s":""} d'affilée</h3><p class="muted">Une semaine compte quand tu atteins ${pr.days} séances. Record : ${st.best}.</p></div></div></section>
  ${challengeCard()}
  ${stepsCard()}
  ${mealCard()}
  ${nutriCard(false)}
  ${musicMini()}
  <section class="card"><div class="row between"><h2>Au programme</h2><span class="muted">${se.rounds} × ce circuit</span></div>
    <div class="list">${se.exs.map(e=>`<details class="ex"><summary><div><b>${e.n}</b><p class="how">Voir comment faire</p></div><span class="dose num">${doseLabel(e)}</span></summary><div class="demo-box">${figSvg(e.id,"demo sm")}<p class="muted" style="font-size:.88rem">${e.c}</p><a href="${videoUrl(e.id)}" target="_blank" rel="noopener">Voir des vidéos de l'exercice</a></div></details>`).join("")}</div>
    <p class="muted" style="font-size:.85rem">Adapté à ton objectif : ${GOALS[pr.goal]?GOALS[pr.goal].prog:""} Échauffement et étirements guidés inclus, ${se.rest} s de récupération entre les exercices.</p>
  </section>`;
}
function progress(){
  const st=stats(),lv=level(st.xp),pct=lv.to?Math.round((st.xp-lv.from)/(lv.to-lv.from)*100):100;
  const m=new Set(S.sessions.map(s=>dkey(new Date(s.d)))),mon=monday(new Date()),tk=new Date();
  const weeks=[...Array(10)].map((_,i)=>addDays(mon,-7*(9-i)));
  let grid='<span></span>'+weeks.map(w=>`<span style="text-align:center">${w.getDate()}</span>`).join("");
  DAYS.forEach((l,di)=>{grid+=`<span>${l}</span>`+weeks.map(w=>{const d=addDays(w,di);return `<span class="cell ${d>tk?"future":m.has(dkey(d))?"on":""}" title="${dkey(d)}"></span>`}).join("")});
  return `${header("Tes progrès")}
  <section class="card"><div class="row between"><div><p class="eyebrow">Niveau ${lv.i}</p><h2>${lv.name}</h2></div><span class="num muted">${st.xp} XP</span></div>
    <div class="xpbar"><i style="width:${pct}%"></i></div>
    <p class="muted">${lv.to?`Encore ${lv.to-st.xp} XP pour devenir « ${lv.next} ». Chaque séance rapporte environ 100 à 250 XP.`:"Niveau maximum. Respect."}</p></section>
  <div class="stats num"><div class="stat"><b>${st.n}</b><span>séances</span></div><div class="stat"><b>${st.min}</b><span>minutes</span></div><div class="stat"><b>${st.best}</b><span>record série</span></div></div>
  <section class="card"><h2>10 dernières semaines</h2><div class="heat-grid">${grid}</div><p class="muted" style="font-size:.8rem">Chaque case verte est un jour avec une séance. Les numéros sont les lundis.</p></section>
  <section class="card"><h2>Badges</h2><div class="badges">${BADGES.map(([ic,l,f])=>`<div class="badge ${f(st)?"got":""}"><span class="medal">${ic}</span>${l}</div>`).join("")}</div></section>
  ${goalCard(true)}
  ${nutriCard(true)}
  ${S.profile.goal==="poids"?"":weightCard()}
  <section class="card"><h2>Historique</h2>${S.sessions.length?`<div class="hist">${S.sessions.slice().reverse().slice(0,15).map(s=>`<div class="h"><span>${fmtDate(s.d)} · ${TYPES[s.t]||"Séance"}</span><span class="muted num">${s.min} min · +${s.xp} XP</span></div>`).join("")}</div>`:`<p class="muted">Ta première séance apparaîtra ici. Lance-la depuis l'onglet Séance.</p>`}</section>`;
}
function weightCard(){
  const w=S.weights||[];let chart="";
  if(w.length>=2){
    const W=320,H=120,P=24,vs=w.map(x=>x.kg),mn=Math.min(...vs),mx=Math.max(...vs),rg=Math.max(1,mx-mn);
    const pts=w.map((x,i)=>[P+(W-2*P)*i/(w.length-1),P/2+(H-P)*(1-(x.kg-mn)/rg)]);
    const last=pts[pts.length-1];
    chart=`<svg class="chart" viewBox="0 0 ${W} ${H+14}" role="img" aria-label="Évolution du poids">
      <line x1="${P}" x2="${W-P}" y1="${P/2}" y2="${P/2}" stroke="var(--line)"/><line x1="${P}" x2="${W-P}" y1="${H-P/2}" y2="${H-P/2}" stroke="var(--line)"/>
      <text x="0" y="${P/2+4}" font-size="10" fill="var(--muted)">${mx}</text><text x="0" y="${H-P/2+4}" font-size="10" fill="var(--muted)">${mn}</text>
      <polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--accent)"/>
      <text x="${P}" y="${H+12}" font-size="10" fill="var(--muted)">${new Date(w[0].d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</text>
      <text x="${W-P}" y="${H+12}" font-size="10" fill="var(--muted)" text-anchor="end">${new Date(w[w.length-1].d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</text></svg>`;
  }
  const diff=w.length>=2?(w[w.length-1].kg-w[0].kg):null;
  return `<section class="card"><div class="row between"><h2>Poids</h2>${w.length?`<span class="num"><b>${w[w.length-1].kg} kg</b>${diff!==null?` <span class="muted">(${diff>0?"+":""}${diff.toFixed(1)} depuis le début)</span>`:""}</span>`:""}</div>
    ${chart||`<p class="muted">Facultatif. Note ton poids une fois par semaine, le matin, pour voir la tendance.</p>`}
    <form class="row" id="wform"><input class="text num" id="kg" type="number" inputmode="decimal" step="0.1" min="30" max="250" placeholder="ex. 78,5" aria-label="Poids en kg"><button class="btn primary" type="submit">Ajouter</button></form></section>`;
}
function optGroup(name,type,items,sel){
  return `<div class="opts">${items.map(([v,l])=>`<label class="opt"><input type="${type}" name="${name}" id="${name}-${v}" value="${v}" ${(Array.isArray(sel)?sel.includes(v):sel==v)?"checked":""}><span>${l}</span></label>`).join("")}</div>`;
}
function formFields(p){
  return `<div class="field"><label for="f-name">Ton prénom</label><input class="text" id="f-name" value="${esc(p.name||"")}" placeholder="Facultatif" autocomplete="given-name"></div>
  ${p.level?"":`<div class="field"><span class="lab">Ton niveau actuel</span>${optGroup("level","radio",[["deb","Je reprends de zéro"],["int","Je bouge un peu"],["ava","Je suis déjà sportif"]],"deb")}</div>`}
  <div class="field"><span class="lab">Ton objectif</span>${optGroup("goal","radio",Object.entries(GOALS).map(([k,g])=>[k,g.l]),p.goal||"forme")}</div>
  ${Object.entries(GOALS).map(([k,g])=>{const o=(p.goal===k&&p.obj)||{};return `<div class="field goalbox" data-g="${k}" ${(p.goal||"forme")===k?"":"hidden"}>
    <p class="muted" style="font-size:.85rem">${g.prog}</p>
    ${g.startQ?`<label for="gs-${k}">${g.startQ}</label><input class="text num" id="gs-${k}" type="number" inputmode="decimal" step="${g.step}" min="0" value="${o.start??""}">`:""}
    <label for="gt-${k}">${g.tgtQ}</label><input class="text num" id="gt-${k}" type="number" inputmode="decimal" step="${g.step}" min="0" value="${o.target??(k==="douceur"?(p.days||3)*8:"")}" placeholder="Facultatif, mais motivant">
    <span class="lab" style="font-weight:500">En combien de temps ?</span><div id="gwo-${k}">${optGroup("gw-"+k,"radio",weekOpts(o.weeks),o.weeks||8)}</div>
    <div class="pacebox" id="pace-${k}" aria-live="polite"></div>
  </div>`}).join("")}
  <div class="field"><span class="lab">Ton matériel</span>${optGroup("equip","checkbox",[["rien","Aucun matériel, pas même une chaise"],["halteres","Haltères"],["elastique","Élastique"]],p.equip||[])}<p class="muted" style="font-size:.85rem">« Aucun matériel » : tout se fait au poids du corps, avec le sol et un mur. Sinon, une chaise et une table suffisent.</p></div>
  <div class="field"><span class="lab">Temps par séance</span>${optGroup("minutes","radio",[[10,"10 min"],[20,"20 min"],[30,"30 min"],[45,"45 min"]],p.minutes||20)}</div>
  <div class="field"><span class="lab">Séances par semaine</span>${optGroup("days","radio",[[2,"2"],[3,"3"],[4,"4"],[5,"5"]],p.days||3)}</div>
  <div class="field"><span class="lab">Des contraintes ?</span>${optGroup("lim","checkbox",[["nojump","Pas de sauts (genoux, voisins…)"],["nofloor","Éviter le sol (se relever est difficile)"]],p.lim||[])}<p class="muted" style="font-size:.85rem">Les exercices sont remplacés par des versions adaptées. En cas de douleur ou de problème de santé, demande l'avis d'un médecin avant de commencer.</p></div>`;
}
function readForm(base){
  const v=n=>document.querySelector(`input[name="${n}"]:checked`)?.value;
  const goal=v("goal")||"forme",num=id=>{const el=document.getElementById(id);const x=el?parseFloat(String(el.value).replace(",",".")):NaN;return isFinite(x)&&x>=0?x:null};
  const ob={start:num("gs-"+goal),target:num("gt-"+goal),weeks:+(v("gw-"+goal)||8)};
  const old=base.obj||{},same=base.goal===goal&&old.start===ob.start&&old.target===ob.target&&old.weeks===ob.weeks;
  ob.setAt=same&&old.setAt?old.setAt:Date.now();
  return {...base,name:$("#f-name").value.trim().slice(0,30),level:base.level||v("level")||"deb",goal,obj:ob.target!=null?ob:null,
    equip:[...document.querySelectorAll('input[name="equip"]:checked')].map(i=>i.value),lim:[...document.querySelectorAll('input[name="lim"]:checked')].map(i=>i.value),minutes:+(v("minutes")||20),days:+(v("days")||3)};
}
function onboarding(){
  return `<div class="wrap" style="padding-bottom:40px">
  <div><p class="eyebrow">Bienvenue</p><h1 style="font-size:3rem">Déclic</h1><p class="muted">Ton coach de poche. Des séances courtes qui s'adaptent à toi, un suivi simple, et de quoi garder la motivation semaine après semaine.</p></div>
  <form class="card" id="onb">${formFields({})}<button class="btn primary big" type="submit">Créer mon programme</button></form></div>`;
}
function profile(){
  const p=S.profile;
  return `${header("Réglages")}
  <form class="card" id="prof">${formFields(p)}<button class="btn primary" type="submit">Enregistrer</button></form>
  <section class="card"><h2>Difficulté</h2><p class="muted">Le palier monte tout seul selon tes retours après chaque séance. Tu peux aussi l'ajuster ici.</p>
    <div class="stepper"><button class="btn" data-act="pal-">−</button><b class="num">${Math.floor(S.palier)}</b><button class="btn" data-act="pal+">+</button><span class="muted">sur 20</span></div></section>
  ${musicCard(true)}
  ${reminderCard()}
  <section class="card"><h2>${IS_APP?"Appli":"Sur ton téléphone"}</h2>${IS_APP?`<p class="muted num">Version de l'appli : ${esc(window.ElanAndroid.versionName())}</p>`:`<p class="muted">Astuce : ajoute cette page à ton écran d'accueil (menu Partager puis « Sur l'écran d'accueil » sur iPhone, menu ⋮ puis « Ajouter à l'écran d'accueil » sur Android).</p>`}</section>
  ${backupCard()}
  <section class="card"><h2>Données</h2><p class="muted" id="sync">${syncLabel()}</p>

function firstMeasure(){
  const p=S.profile,o=p.obj;if(!o||o.start==null||p.goal==="douceur")return;
  const sr=series();if(sr.length&&sr[sr.length-1].v===o.start)return;
  addMeasure(o.start);
}
function addMeasure(v){
  const g=S.profile.goal,k=dkey(new Date()),d=new Date().toISOString();
  if(g==="poids"){S.weights=(S.weights||[]).filter(w=>dkey(new Date(w.d))!==k);S.weights.push({d,kg:Math.round(v*10)/10});return}
  S.measures=S.measures||{};S.measures[g]=(S.measures[g]||[]).filter(w=>dkey(new Date(w.d))!==k);S.measures[g].push({d,v:Math.round(v*10)/10});
}
document.addEventListener("change",e=>{
  if(e.target.name==="equip"&&e.target.checked)document.querySelectorAll('input[name="equip"]').forEach(i=>{if(i!==e.target&&(e.target.value==="rien"||i.value==="rien"))i.checked=false});
  if(e.target.name==="goal")document.querySelectorAll(".goalbox").forEach(b=>b.hidden=b.dataset.g!==e.target.value);
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="gform")return;e.preventDefault();
  const v=parseFloat(String($("#gval").value).replace(",","."));if(!(v>=0&&v<1000))return;
  addMeasure(v);checkChallenge(true);save();render();
});

/* ---------- Événements ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  const a=t.dataset.act;
  if(a==="start")startWorkout();
  if(a==="pal-"||a==="pal+"){S.palier=Math.max(1,Math.min(20,Math.floor(S.palier)+(a==="pal+"?1:-1)));save();render()}
  if(a==="reset"){$("#resetBox").innerHTML=`<p>Effacer toutes tes séances et réglages ? C'est définitif.</p><div class="row"><button class="btn small" data-act="reset-yes" style="background:var(--heat);color:#fff">Oui, tout effacer</button><button class="btn ghost small" data-act="reset-no">Annuler</button></div>`}
  if(a==="reset-no")render();
  if(a==="reset-yes"){S={profile:null,palier:1,sessions:[],weights:[]};save();tab="today";render()}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if((e.target.id==="onb"||e.target.id==="prof")&&!paceOk())return;
  if(e.target.id==="onb"){const p=readForm({});S={profile:p,palier:p.goal==="douceur"?Math.min(4,START[p.level]):START[p.level],sessions:[],weights:[],measures:{},created:Date.now()};firstMeasure();save();tab="today";render();window.scrollTo(0,0)}
  if(e.target.id==="prof"){S.profile=readForm(S.profile);firstMeasure();save();render();const b=$("#prof button[type=submit]");if(b){b.textContent="Enregistré";}}
  if(e.target.id==="wform"){const v=parseFloat(String($("#kg").value).replace(",","."));if(v>=30&&v<=250){S.weights=S.weights||[];const k=dkey(new Date());S.weights=S.weights.filter(w=>dkey(new Date(w.d))!==k);S.weights.push({d:new Date().toISOString(),kg:Math.round(v*10)/10});save();render()}}
});

/* ---------- Séance guidée ---------- */
let W=null,actx=null,lock=null;
function beep(f=880,d=.12,v=.25){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type="sine";g.gain.value=v;o.connect(g);g.connect(actx.destination);const t=actx.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.02)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
async function wake(){try{lock=await navigator.wakeLock?.request("screen")}catch(e){lock=null}}
document.addEventListener("visibilitychange",()=>{if(W&&!document.hidden)wake()});
function startWorkout(minOverride){
  try{window.ElanAndroid&&window.ElanAndroid.keepAwake(true)}catch(e){}
  if(TRACKS.length&&!playing())musicPlay(S.music&&S.music.shuffle?Math.floor(Math.random()*TRACKS.length):ti);
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  const se=buildSession(minOverride);
  W={se,i:0,t0:Date.now(),stepStart:Date.now(),paused:false,pausedAt:0,last:-1,phase:"run"};
  wake();$("#player").hidden=false;document.body.style.overflow="hidden";
  drawStep();W.timer=setInterval(tick,200);
}
function remaining(){const st=W.se.steps[W.i];if(st.m!=="time")return null;
  const el=((W.paused?W.pausedAt:Date.now())-W.stepStart)/1000;return Math.max(0,Math.ceil(st.v-el))}
function tick(){
  if(!W||W.phase!=="run"||W.paused)return;
  const st=W.se.steps[W.i];
  if(st.m==="time"){const r=remaining();
    if(r!==W.last){W.last=r;const el=$("#cd");if(el)el.textContent=r;if(r<=3&&r>0)beep(660,.1);}
    if(r<=0)next();
  }else{const el=$("#cd2");if(el){const s=Math.floor((Date.now()-W.stepStart)/1000);el.textContent=`${Math.floor(s/60)}:${pad(s%60)}`}}
}
function next(){
  W.i++;W.stepStart=Date.now();W.last=-1;
  if(W.i>=W.se.steps.length){finish(true);return}
  const st=W.se.steps[W.i];beep(st.k==="rest"?520:990,.25);buzz(st.k==="rest"?120:[80,60,80]);drawStep();
}
function drawStep(){
  const P=$("#player"),se=W.se,st=se.steps[W.i],nx=se.steps.slice(W.i+1).find(s=>s.k!=="rest");
  const pct=Math.round(W.i/se.steps.length*100);
  const label={warm:"Échauffement",work:`Exercice · tour ${st.r}/${st.R}`,rest:"Récupération",cool:"Retour au calme"}[st.k];
  P.className="player"+(st.k==="rest"?" rest":"");
  const main=st.m==="time"
    ?`<div class="big"><span id="cd">${remaining()}</span><small>secondes</small></div>`
    :`<div class="big">${st.v}<small>répétitions${st.s?" par côté":""}</small></div><p class="muted num">À ton rythme · <span id="cd2">0:00</span></p>`;
  P.innerHTML=`<div class="pin">
    <div class="row between"><span class="eyebrow num">${se.name} · ${pct} %</span><button class="btn small ghost" data-w="quit">Arrêter</button></div>
    <div class="prog"><i style="width:${pct}%"></i></div>${musicBar()}
    <div class="stage">${st.id&&FIG[st.id]?figSvg(st.id):(st.k==="rest"&&nx&&nx.id&&FIG[nx.id]?figSvg(nx.id):"")}<span class="kind">${label}</span><h1>${st.n}</h1>${main}${st.c?`<p class="cue">${st.c}</p>`:""}
      ${nx?`<p class="next">Ensuite : <b>${nx.n}</b>${nx.k==="work"?" · "+doseLabel(nx):""}</p>`:""}</div>
    <div class="controls">${st.m==="time"
      ?`<button class="btn" data-w="back">Retour</button><button class="btn primary" data-w="pause">${W.paused?"Reprendre":"Pause"}</button><button class="btn" data-w="skip">${st.k==="rest"?"Passer":"Suivant"}</button>`
      :`<button class="btn" data-w="back">Retour</button><button class="btn primary" data-w="skip">Fait ✓</button><button class="btn" data-w="skip">Passer</button>`}</div>
  </div>`;
}
function drawQuit(){
  W.phase="quit";if(!W.paused){W.paused=true;W.pausedAt=Date.now()}
  const doneWork=W.se.steps.slice(0,W.i).filter(s=>s.k==="work").length;
  $("#player").className="player";

  if($("#player").hidden)render();

  if(!window.ElanAndroid.pendingUpdate&&/\//.test(REPO))(async()=>{try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/releases/latest`,{headers:{Accept:"application/vnd.github+json"}});if(!r.ok)return;
    const j=await r.json(),n=parseInt(String(j.tag_name||"").replace(/\D/g,""),10),mine=+window.ElanAndroid.versionCode();
    const a=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));

/* ---------- Délai réaliste pour l'objectif ---------- */
const STD_WEEKS=[[4,"1 mois"],[8,"2 mois"],[12,"3 mois"],[24,"6 mois"]];
function weekOpts(w){const o=STD_WEEKS.slice();if(w&&!o.some(x=>x[0]==w))o.push([w,`${w} semaines`]);return o.sort((a,b)=>a[0]-b[0])}
function safeRate(k,start,days){
  if(k==="poids")return Math.max(.5,Math.min(1,start*.01));
  if(k==="force")return Math.max(1,start*.1);
  if(k==="tonus")return .75;
  if(k==="forme")return Math.max(5,start*.1);
  if(k==="douceur")return days||3;
  return 1;
}
const paceDecision={};
function paceRead(k){
  const num=id=>{const el=document.getElementById(id);const x=el?parseFloat(String(el.value).replace(",",".")):NaN;return isFinite(x)&&x>=0?x:null};
  const G=GOALS[k],start=k==="douceur"?0:num("gs-"+k),target=num("gt-"+k);
  const w=+(document.querySelector(`input[name="gw-${k}"]:checked`)?.value||8);
  const days=+(document.querySelector('input[name="days"]:checked')?.value||3);
  return {G,start,target,w,days};
}
function paceInfo(k){
  const {G,start,target,w,days}=paceRead(k);
  if(target==null||start==null)return null;
  const diff=(target-start)*G.dir;
  if(diff<=0)return {bad:k==="douceur"?"Indique un nombre de séances.":`Ta cible doit être ${G.dir<0?"plus basse":"plus haute"} que ton point de départ.`};
  const rate=diff/w,safe=safeRate(k,start,days),sug=Math.max(1,Math.ceil(diff/safe));
  return {G,rate,safe,w,sug,too:rate>safe*1.05,end:addDays(new Date(),w*7),sugEnd:addDays(new Date(),sug*7)};
}

/* ---------- Trajectoire : en avance ou en retard ---------- */
function trackLine(){
  const t=trajInfo();if(!t||t.delta==null)return "";
  const G=goalInfo().G,d=Math.abs(t.delta);
  if(d<(G.unit==="kg"?.3:G.unit==="cm"?.5:1))return `<p class="track ahead">Tu es pile sur ta trajectoire.</p>`;

}

/* ---------- Défi de la semaine ---------- */
function weekSessions(ws){const we=addDays(ws,7);return S.sessions.filter(x=>{const d=new Date(x.d);return d>=ws&&d<we})}
function weekSteps(ws){let t=0;for(let i=0;i<7;i++)t+=STEPS[dkey(addDays(ws,i))]||0;return t}
const CHALLENGES=[
  {id:"all",t:()=>`Fais tes ${S.profile.days} séances de la semaine`,ok:ws=>weekSessions(ws).length>=S.profile.days},
  {id:"early",t:()=>"Fais une séance avant 9 h",ok:ws=>weekSessions(ws).some(x=>new Date(x.d).getHours()<9)},
  {id:"long",t:()=>"Fais une séance d'au moins 20 minutes",ok:ws=>weekSessions(ws).some(x=>x.min>=20)},
  {id:"streak2",t:()=>"Entraîne-toi deux jours de suite",ok:ws=>{const ds=new Set(weekSessions(ws).map(x=>dkey(new Date(x.d))));return [...ds].some(k=>ds.has(dkey(addDays(new Date(k+"T12:00"),1))))}},
  {id:"measure",t:()=>`Note ta mesure de la semaine (${(GOALS[S.profile.goal]||GOALS.forme).metric.toLowerCase()})`,ok:ws=>series().some(x=>{const d=new Date(x.d);return d>=ws&&d<addDays(ws,7)}),skip:()=>S.profile.goal==="douceur"},
  {id:"weekend",t:()=>"Fais une séance le week-end",ok:ws=>weekSessions(ws).some(x=>[0,6].includes(new Date(x.d).getDay()))},
  {id:"steps",t:()=>"Marche 50 000 pas dans la semaine",ok:ws=>weekSteps(ws)>=50000,skip:()=>!stepsOn()},
  {id:"hard",t:()=>"Termine une séance complète sans t'arrêter avant la fin",ok:ws=>weekSessions(ws).some(x=>x.full)}
];
function challengeFor(ws){
  const list=CHALLENGES.filter(c=>!(c.skip&&c.skip()));
  const n=Math.floor(ws.getTime()/(7*864e5));return list[((n%list.length)+list.length)%list.length];
}
function checkChallenge(quiet){
  if(!S||!S.profile)return false;
  const ws=monday(new Date()),k=dkey(ws),c=challengeFor(ws);
  S.challenges=S.challenges||{};
  if(S.challenges[k]||!c.ok(ws))return false;
  S.challenges[k]=c.id;S.bonus=S.bonus||[];S.bonus.push({d:new Date().toISOString(),xp:100,why:"Défi : "+c.t()});
  if(!quiet)save();
  return true;
}
function challengeCard(){
  const ws=monday(new Date()),k=dkey(ws),c=challengeFor(ws),done=!!(S.challenges||{})[k];
  const daysLeft=7-((new Date().getDay()+6)%7);
  return `<section class="card chal ${done?"done":""}"><p class="eyebrow">Défi de la semaine · +100 XP</p><h3>${c.t()}</h3>
    <p class="${done?"ok":"muted"}">${done?"Défi réussi, bravo ! Les 100 XP sont à toi.":`Encore ${daysLeft} jour${daysLeft>1?"s":""} pour le relever. Il se valide tout seul.`}</p></section>`;
}

/* ---------- Bilan du dimanche ---------- */
function recapCard(){
  const now=new Date(),dow=now.getDay();
  if(dow!==0&&dow!==1)return "";
  const ws=dow===0?monday(now):addDays(monday(now),-7),we=addDays(ws,7);
  const ss=weekSessions(ws),min=ss.reduce((a,x)=>a+(x.min||0),0),xp=ss.reduce((a,x)=>a+(x.xp||0),0);
  const sr=series().filter(x=>{const d=new Date(x.d);return d<we});
  const before=sr.filter(x=>new Date(x.d)<ws),inW=sr.filter(x=>new Date(x.d)>=ws);
  const G=(GOALS[S.profile.goal]||GOALS.forme);
  let mTxt="";if(inW.length&&(before.length||inW.length>1)){const a=(before.length?before[before.length-1]:inW[0]).v,b=inW[inW.length-1].v,d=b-a;mTxt=`${G.metric} : ${d>0?"+":""}${fmtN(d,G.unit)} sur la semaine.`}
  const steps=stepsOn()?weekSteps(ws):0,chal=(S.challenges||{})[dkey(ws)],goal=S.profile.days;
  const verdict=ss.length>=goal?`Semaine réussie : ${ss.length} séance${ss.length>1?"s":""} sur ${goal}. Tu construis une vraie habitude, je suis fier de toi.`
    :ss.length>0?`${ss.length} séance${ss.length>1?"s":""} sur ${goal}. C'est un début : la semaine prochaine, on vise ${goal}. Bloque les créneaux dès lundi.`
    :"Semaine blanche. Ça arrive. On repart lundi avec une première séance courte, sans pression.";
  return `<section class="card recap"><p class="eyebrow">Bilan de la semaine du ${ws.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}</p>
    <div class="coach-head">${COACH_AV}<p>${verdict}</p></div>
    <div class="stats num"><div class="stat"><b>${ss.length}/${goal}</b><span>séances</span></div><div class="stat"><b>${min}</b><span>minutes</span></div><div class="stat"><b>${xp+(chal?100:0)}</b><span>XP gagnés</span></div></div>
    ${mTxt?`<p>${mTxt}</p>`:""}${steps?`<p>${steps.toLocaleString("fr-FR")} pas dans la semaine.</p>`:""}
    <p class="${chal?"ok":"muted"}">${chal?"Défi de la semaine réussi.":"Défi de la semaine non relevé."}</p></section>`;
}

    ["Salade niçoise","Thon, œuf dur, haricots verts, tomates, olives, quelques pommes de terre.",15,"lp"],
    ["Curry pois chiches et épinards","Pois chiches, épinards, lait de coco léger, curry, un peu de riz basmati.",25,"vp"],
    ["Poulet rôti et ratatouille","Un morceau de poulet rôti sans la peau, une belle portion de ratatouille.",30,"lp"]]
};
const SLOT_L={pdj:"Petit-déjeuner",dej:"Déjeuner",col:"Collation",din:"Dîner"};
let mealSlot=null,mealShift={},mealPlanOpen=false,mealAI="";
function autoSlot(){const h=new Date().getHours();return h<10?"pdj":h<15?"dej":h<18?"col":"din"}
function mealsFor(slot){
  const veg=!!(S.mealPrefs&&S.mealPrefs.veg),g=S.profile.goal;
  let l=MEALS[slot].filter(m=>!veg||m[3].includes("v"));
  const pref=g==="poids"||g==="tonus"?"l":g==="force"?"p":"";
  if(pref){const a=l.filter(m=>m[3].includes(pref));if(a.length>=3)l=a}
  return l;
}
function pickMeal(slot){const l=mealsFor(slot),day=Math.floor(Date.now()/864e5);return l[((day+(mealShift[slot]||0))%l.length+l.length)%l.length]}
function portionTip(){const g=S.profile.goal;return g==="poids"?"Féculents : une portion de la taille de ton poing. Légumes à volonté.":g==="force"?"Si tu as encore faim, ajoute une portion de féculents ou un laitage.":"Adapte la portion à ta faim."}
function mealCard(){
  const slot=mealSlot||autoSlot(),m=pickMeal(slot),veg=!!(S.mealPrefs&&S.mealPrefs.veg);
  return `<section class="card meal" id="meals"><div class="row between"><p class="eyebrow">Idée de repas</p><label class="opt"><input type="checkbox" id="meal-veg" ${veg?"checked":""}><span style="padding:4px 10px;font-size:.8rem">Végétarien</span></label></div>
    <div class="chips" role="tablist">${Object.entries(SLOT_L).map(([k,l])=>`<button data-meal-slot="${k}" ${k===slot?'style="border-color:var(--accent);color:var(--accent)"':""}>${l}</button>`).join("")}</div>
    <h3>${m[0]}</h3><p class="ing">${m[1]}</p>
    <p class="muted" style="font-size:.85rem">${m[2]?`Prêt en ${m[2]} min. `:""}${portionTip()}</p>
    <div class="row" style="flex-wrap:wrap"><button class="btn small" data-act="meal-next">Autre idée</button><button class="btn ghost small" data-act="meal-plan">${mealPlanOpen?"Masquer":"Menu"} de la journée</button></div>
    ${mealPlanOpen?`<div class="mealplan">${Object.entries(SLOT_L).map(([k,l])=>{const x=pickMeal(k);return `<div><p class="eyebrow">${l}</p><b>${x[0]}</b><p class="muted" style="font-size:.85rem">${x[1]}</p></div>`}).join("")}</div>`:""}
    ${SAMPLE?`<form class="field" id="mealai"><label for="mealai-in" class="lab" style="font-weight:500">Ou dis-moi ce que tu as dans ton frigo</label><div class="row"><input class="text" id="mealai-in" maxlength="200" placeholder="ex. œufs, courgette, riz, feta"><button class="btn" type="submit">Proposer</button></div></form>${mealAI?`<p class="ai-out">${esc(mealAI)}</p>`:""}`:""}
  </section>`;
}
document.addEventListener("click",e=>{
  const sl=e.target.closest("[data-meal-slot]");if(sl){mealSlot=sl.dataset.mealSlot;render();return}
  const t=e.target.closest("[data-act]");if(!t)return;
  if(t.dataset.act==="meal-next"){const k=mealSlot||autoSlot();mealShift[k]=(mealShift[k]||0)+1;render()}
  if(t.dataset.act==="meal-plan"){mealPlanOpen=!mealPlanOpen;render()}
});
document.addEventListener("change",e=>{if(e.target.id==="meal-veg"){S.mealPrefs={...(S.mealPrefs||{}),veg:e.target.checked};mealShift={};save();render()}});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="mealai")return;e.preventDefault();
  const v=$("#mealai-in").value.trim();if(!v||!SAMPLE)return;
  mealAI="Je cherche une idée…";render();
  const g=GOALS[S.profile.goal]?GOALS[S.profile.goal].l:"être en forme",veg=S.mealPrefs&&S.mealPrefs.veg;
  try{const r=await SAMPLE(`Propose UN repas simple et équilibré, en français, pour quelqu'un dont l'objectif est : ${g}.${veg?" Il est végétarien.":""} Ingrédients disponibles : ${v} (il a aussi les basiques : huile, sel, poivre, épices, pâtes ou riz). Format : le nom du plat sur la première ligne, puis les ingrédients avec quantités pour 1 personne sur une ligne, puis 3 à 5 étapes courtes numérotées, puis une phrase sur pourquoi c'est adapté à son objectif. Pas de calories. Texte brut, sans markdown.`,{modelTier:"quick"});
    mealAI=(r.text||"").trim()||"Je n'ai pas trouvé d'idée, réessaie avec d'autres ingrédients.";}
  catch(err){mealAI="Je n'arrive pas à proposer de repas pour l'instant. Choisis une idée ci-dessus."}
  render();
});
function musicMini(){
  const m=S.music||{},n=TRACKS.length,picks=(m.picks||[]).length;
  return `<section class="card"><div class="row between"><div><p class="eyebrow">Musique</p><p>${n?`${n} morceau${n>1?"x":""} prêt${n>1?"s":""}, ils démarrent avec la séance.`:picks?`${picks} morceaux choisis pour toi.`:"Ajoute ta musique pour te motiver pendant la séance."}</p></div></div>
    <div class="row" style="flex-wrap:wrap">${m.link?`<a class="btn small" href="${esc(m.link)}" target="_blank" rel="noopener">Ouvrir ma playlist</a>`:""}<button class="btn ghost small" data-tab="profile" data-goto="music">Gérer ma musique</button></div></section>`;
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-goto]");if(t)setTimeout(()=>{const el=document.getElementById(t.dataset.goto);if(el)el.scrollIntoView({block:"start"})},50)});
render();
</script>
